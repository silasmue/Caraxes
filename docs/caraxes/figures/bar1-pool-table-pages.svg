<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13">
  <!-- SPDX-License-Identifier: MIT -->
  <!-- bar1-pool.md §10: a guest page-table page reachable through a BAR1 pool area page. -->
  <title>BAR1 pool: a page-table page behind an area page, before and after the fail-closed rule</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e8449"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="470" fill="#ffffff"/>

  <!-- Column headers -->
  <text x="215" y="26" text-anchor="middle" font-weight="bold" font-size="15">Before: the page lives in the pool</text>
  <text x="645" y="26" text-anchor="middle" font-weight="bold" font-size="15">Now: the page stays on the trapped path</text>
  <line x1="430" y1="12" x2="430" y2="455" stroke="#999" stroke-dasharray="4 4"/>

  <!-- ===== Before ===== -->
  <rect x="20" y="50" width="140" height="44" rx="6" fill="#eef3fb" stroke="#4a6fa5"/>
  <text x="90" y="70" text-anchor="middle">guest RM (CPU)</text>
  <text x="90" y="86" text-anchor="middle" font-size="11">writes a PDE/PTE</text>

  <rect x="20" y="150" width="140" height="44" rx="6" fill="#fdf2e9" stroke="#b9770e"/>
  <text x="90" y="170" text-anchor="middle">BAR1 area page g</text>
  <text x="90" y="186" text-anchor="middle" font-size="11">untrapped (dma-buf)</text>

  <rect x="20" y="260" width="140" height="44" rx="6" fill="#fdf2e9" stroke="#b9770e"/>
  <text x="90" y="280" text-anchor="middle">pool page P</text>
  <text x="90" y="296" text-anchor="middle" font-size="11">holds table page X</text>

  <rect x="230" y="150" width="180" height="44" rx="6" fill="#f4f6f7" stroke="#566573"/>
  <text x="320" y="170" text-anchor="middle">FakeFb::write</text>
  <text x="320" y="186" text-anchor="middle" font-size="11">note_write (tracking)</text>

  <rect x="230" y="260" width="180" height="44" rx="6" fill="#eafaf1" stroke="#1e8449"/>
  <text x="320" y="280" text-anchor="middle">shadow walk cache</text>
  <text x="320" y="296" text-anchor="middle" font-size="11">copy of X (watched)</text>

  <rect x="230" y="370" width="180" height="44" rx="6" fill="#f4f6f7" stroke="#566573"/>
  <text x="320" y="390" text-anchor="middle">host shadow VAS</text>
  <text x="320" y="406" text-anchor="middle" font-size="11">what the GPU walks</text>

  <line x1="90" y1="94" x2="90" y2="148" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="90" y1="194" x2="90" y2="258" stroke="#c0392b" stroke-width="2" marker-end="url(#r)"/>
  <text x="98" y="232" fill="#c0392b" font-size="11">no trap</text>
  <!-- bypass: nothing reaches note_write -->
  <line x1="160" y1="172" x2="226" y2="172" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="193" y="164" text-anchor="middle" fill="#c0392b" font-weight="bold" font-size="16">✕</text>
  <line x1="320" y1="194" x2="320" y2="258" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="320" y1="304" x2="320" y2="368" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="330" y="340" font-size="11" fill="#c0392b">stale copy: PDE missing</text>
  <text x="215" y="445" text-anchor="middle" fill="#c0392b" font-size="12">copy engine walks the shadow: FAULT_PDE (Xid 31)</text>

  <!-- ===== Now ===== -->
  <rect x="450" y="50" width="140" height="44" rx="6" fill="#eef3fb" stroke="#4a6fa5"/>
  <text x="520" y="70" text-anchor="middle">guest RM (CPU)</text>
  <text x="520" y="86" text-anchor="middle" font-size="11">writes a PDE/PTE</text>

  <rect x="450" y="150" width="140" height="44" rx="6" fill="#fdf2e9" stroke="#b9770e"/>
  <text x="520" y="170" text-anchor="middle">BAR1 area page g</text>
  <text x="520" y="186" text-anchor="middle" font-size="11">untrapped (dma-buf)</text>

  <rect x="450" y="260" width="140" height="44" rx="6" fill="#fdf2e9" stroke="#b9770e"/>
  <text x="520" y="280" text-anchor="middle">pool page P</text>
  <text x="520" y="296" text-anchor="middle" font-size="11">replica of X</text>

  <rect x="660" y="260" width="180" height="44" rx="6" fill="#f4f6f7" stroke="#566573"/>
  <text x="750" y="280" text-anchor="middle">table page X at home</text>
  <text x="750" y="296" text-anchor="middle" font-size="11">never remapped</text>

  <rect x="660" y="150" width="180" height="44" rx="6" fill="#eafaf1" stroke="#1e8449"/>
  <text x="750" y="170" text-anchor="middle">sync point</text>
  <text x="750" y="186" text-anchor="middle" font-size="10">invalidate, GSP doorbell, poll</text>

  <rect x="660" y="370" width="180" height="44" rx="6" fill="#eafaf1" stroke="#1e8449"/>
  <text x="750" y="390" text-anchor="middle">FakeFb::write → walk cache</text>
  <text x="750" y="406" text-anchor="middle" font-size="11">→ host shadow VAS</text>

  <line x1="520" y1="94" x2="520" y2="148" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="520" y1="194" x2="520" y2="258" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="528" y="232" font-size="11">no trap</text>
  <!-- merge: area words that changed go home as tracked writes -->
  <path d="M590,272 L656,272" stroke="#1e8449" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <path d="M656,292 L592,292" stroke="#566573" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="623" y="265" text-anchor="middle" fill="#1e8449" font-size="10">area→home</text>
  <text x="623" y="310" text-anchor="middle" font-size="10">home→area</text>
  <line x1="750" y1="194" x2="750" y2="256" stroke="#1e8449" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#g)"/>
  <text x="758" y="232" fill="#1e8449" font-size="11">merge per 8 bytes</text>
  <line x1="750" y1="304" x2="750" y2="368" stroke="#1e8449" stroke-width="2" marker-end="url(#g)"/>
  <text x="645" y="445" text-anchor="middle" fill="#1e8449" font-size="12">the shadow sees every PDE before the guest's work runs</text>
</svg>
