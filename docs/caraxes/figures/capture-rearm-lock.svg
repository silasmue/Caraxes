<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13">
  <!-- SPDX-License-Identifier: MIT -->
  <!-- sottr-stage.md §11: 22 ms of trace-stream60-13s.txt (2790.960 to 2790.982 s device time). -->
  <title>The MSI re-arm's pool poll holds the device lock, the flip latch waits for it</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="400" fill="#ffffff"/>
  <text x="430" y="24" text-anchor="middle" font-weight="bold" font-size="15">22 ms of the stream at 60 fps (device trace, times in ms from 2790.960 s)</text>

  <!-- Axis: x = 150 + (t_ms) * 30, t from 0 to 22.5 -->
  <line x1="150" y1="330" x2="825" y2="330" stroke="#333"/>
  <g font-size="11" text-anchor="middle" fill="#333">
    <line x1="150" y1="330" x2="150" y2="336" stroke="#333"/><text x="150" y="350">0</text>
    <line x1="300" y1="330" x2="300" y2="336" stroke="#333"/><text x="300" y="350">5</text>
    <line x1="450" y1="330" x2="450" y2="336" stroke="#333"/><text x="450" y="350">10</text>
    <line x1="600" y1="330" x2="600" y2="336" stroke="#333"/><text x="600" y="350">15</text>
    <line x1="750" y1="330" x2="750" y2="336" stroke="#333"/><text x="750" y="350">20</text>
  </g>

  <!-- Lane labels -->
  <g font-size="12" fill="#222">
    <text x="12" y="84">guest vCPUs</text>
    <text x="12" y="99" font-size="11" fill="#555">(trapped accesses)</text>
    <text x="12" y="164">doorbell reactor</text>
    <text x="12" y="179" font-size="11" fill="#555">(MSI re-arm)</text>
    <text x="12" y="244">display clock</text>
    <text x="12" y="259" font-size="11" fill="#555">(latch, vblank)</text>
    <text x="12" y="304">device lock</text>
  </g>
  <line x1="150" y1="120" x2="825" y2="120" stroke="#ddd"/>
  <line x1="150" y1="200" x2="825" y2="200" stroke="#ddd"/>
  <line x1="150" y1="275" x2="825" y2="275" stroke="#ddd"/>

  <!-- Guest traps: flush reads 1.0-5.0 ms, invalidate 5.4-7.4 ms, kick at 7.9 ms, then nothing until 21.2 -->
  <g fill="#4a6fa5">
    <rect x="180" y="75" width="3" height="20"/><rect x="188" y="75" width="3" height="20"/>
    <rect x="206" y="75" width="3" height="20"/><rect x="218" y="75" width="3" height="20"/>
    <rect x="228" y="75" width="3" height="20"/><rect x="242" y="75" width="3" height="20"/>
    <rect x="251" y="75" width="3" height="20"/><rect x="259" y="75" width="3" height="20"/>
    <rect x="281" y="75" width="3" height="20"/><rect x="293" y="75" width="3" height="20"/>
    <rect x="301" y="75" width="3" height="20"/>
    <rect x="311" y="75" width="3" height="20"/><rect x="312" y="75" width="3" height="20"/>
    <rect x="324" y="75" width="3" height="20"/><rect x="351" y="75" width="3" height="20"/>
    <rect x="370" y="75" width="3" height="20"/>
    <rect x="787" y="75" width="3" height="20"/><rect x="807" y="75" width="3" height="20"/>
    <rect x="810" y="75" width="3" height="20"/><rect x="822" y="75" width="3" height="20"/>
  </g>
  <rect x="381" y="70" width="4" height="30" fill="#1e8449"/>
  <text x="383" y="62" text-anchor="middle" font-size="11" fill="#1e8449">flip kick (window 6)</text>
  <text x="235" y="62" text-anchor="middle" font-size="11" fill="#4a6fa5">BAR2 flush reads, MMU invalidate</text>
  <rect x="397" y="72" width="388" height="26" fill="none" stroke="#c0392b" stroke-dasharray="4 3"/>
  <text x="591" y="89" text-anchor="middle" font-size="11" fill="#c0392b">no access completes: every trap queues</text>

  <!-- Reactor re-arms -->
  <g fill="#7d3c98">
    <rect x="190" y="155" width="3" height="20"/><rect x="228" y="155" width="3" height="20"/>
    <rect x="302" y="155" width="3" height="20"/><rect x="318" y="155" width="3" height="20"/>
    <rect x="331" y="155" width="3" height="20"/><rect x="357" y="155" width="3" height="20"/>
    <rect x="403" y="155" width="3" height="20"/>
    <rect x="788" y="155" width="3" height="20"/>
  </g>
  <rect x="413" y="150" width="373" height="30" rx="3" fill="#f5b7b1" stroke="#c0392b"/>
  <text x="600" y="170" text-anchor="middle" font-size="12" fill="#7b241c">re-arm at 8.8 ms, then the BAR1 pool's poll: 12.5 ms</text>

  <!-- Display clock: tick due, waits, latches after release -->
  <line x1="420" y1="245" x2="788" y2="245" stroke="#b9770e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="600" y="237" text-anchor="middle" font-size="11" fill="#b9770e">the clock's tick needs the device lock (main.rs:1051) and waits</text>
  <rect x="797" y="232" width="4" height="26" fill="#1e8449"/>
  <text x="799" y="272" text-anchor="middle" font-size="11" fill="#1e8449">latch 21.6 ms</text>

  <!-- Lock lane -->
  <rect x="150" y="292" width="263" height="16" fill="#d5dbdb"/>
  <rect x="413" y="292" width="373" height="16" fill="#c0392b"/>
  <rect x="786" y="292" width="39" height="16" fill="#d5dbdb"/>
  <text x="280" y="304" text-anchor="middle" font-size="11" fill="#333">short holds (0.2-0.6 ms each)</text>
  <text x="600" y="304" text-anchor="middle" font-size="11" fill="#ffffff">held by the reactor (device.rs msi_rearm_ioeventfd)</text>

  <text x="430" y="378" text-anchor="middle" font-size="12" fill="#333">Fix: a BAR0 write that lands in the config mirror (the re-arm) runs no pool poll; the lock stays free for the clock.</text>
</svg>
