<svg width="940" height="620" viewBox="0 0 940 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>VFIO Leandro data path</title>
<desc>The stock guest driver reaches the device process through Cloud Hypervisor's vfio-user client. Register accesses trap (a KVM exit, the VMM and a socket round trip); the BAR1 pool, the BAR2 memfd, the interrupt page, the display page and the GSP message queues are memory the guest writes without an exit; doorbells and the MSI re-arm are ioeventfds served by the reactor thread. The device drives the host RM as an unprivileged client; the GPU runs the guest's channels on host channels over validated shadow page tables.</desc>

<rect x="0" y="0" width="940" height="620" fill="#FFFFFF"/>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-trap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#B3261E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-mem" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-fd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#4A6FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g font-family="Helvetica, Arial, sans-serif">
<text x="470" y="30" text-anchor="middle" font-size="16" font-weight="500" fill="#2C2C2A">VFIO Leandro: the data path, what traps and what is memory</text>

<!-- Guest column -->
<rect x="20" y="50" width="290" height="470" rx="12" fill="#EEEDFE" stroke="#534AB7"/>
<text x="36" y="72" font-size="13" font-weight="500" fill="#3C3489">Guest VM: the stock driver</text>

<rect x="36" y="86" width="258" height="58" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="46" y="104" font-size="12" font-weight="500" fill="#2C2C2A">Kernel RM in GSP-client mode</text>
<text x="46" y="120" font-size="11" fill="#5F5E5A">nvidia.ko, nvidia-uvm, nvidia-modeset;</text>
<text x="46" y="134" font-size="11" fill="#5F5E5A">Windows 617, nova-core, nouveau</text>

<rect x="36" y="156" width="258" height="58" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="46" y="174" font-size="12" font-weight="500" fill="#2C2C2A">BAR0 registers (trapped)</text>
<text x="46" y="190" font-size="11" fill="#5F5E5A">boot, config mirror, PROM, falcons, PTIMER,</text>
<text x="46" y="204" font-size="11" fill="#5F5E5A">MMU invalidate, flush, GSP queue head</text>

<rect x="36" y="226" width="258" height="58" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="46" y="244" font-size="12" font-weight="500" fill="#2C2C2A">Pages the guest writes as memory</text>
<text x="46" y="260" font-size="11" fill="#5F5E5A">GSP message queues in guest RAM, BAR1 pool,</text>
<text x="46" y="274" font-size="11" fill="#5F5E5A">BAR2 memfd, interrupt page, display page</text>

<rect x="36" y="296" width="258" height="58" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="46" y="314" font-size="12" font-weight="500" fill="#2C2C2A">Doorbells</text>
<text x="46" y="330" font-size="11" fill="#5F5E5A">work-submit token at BAR0 0xbb0090,</text>
<text x="46" y="344" font-size="11" fill="#5F5E5A">MSI re-arm at NV_XVE_CYA_2</text>

<rect x="36" y="366" width="258" height="58" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="46" y="384" font-size="12" font-weight="500" fill="#2C2C2A">The guest's own GPU state</text>
<text x="46" y="400" font-size="11" fill="#5F5E5A">GMMU tables in its VRAM slice (through BAR2),</text>
<text x="46" y="414" font-size="11" fill="#5F5E5A">GPFIFO rings, USERD, pushbuffers</text>

<rect x="36" y="436" width="258" height="70" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="46" y="454" font-size="12" font-weight="500" fill="#2C2C2A">Interrupts</text>
<text x="46" y="470" font-size="11" fill="#5F5E5A">one MSI; pending bits land in the interrupt</text>
<text x="46" y="484" font-size="11" fill="#5F5E5A">page before the vector is raised; the guest's</text>
<text x="46" y="498" font-size="11" fill="#5F5E5A">acks and enables are plain stores</text>

<!-- Device column -->
<rect x="340" y="50" width="300" height="470" rx="12" fill="#FFF4E5" stroke="#D9822B"/>
<text x="356" y="72" font-size="13" font-weight="500" fill="#8A4B08">vfio-user-nvgpu: one process per VM</text>

<rect x="356" y="86" width="268" height="58" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="366" y="104" font-size="12" font-weight="500" fill="#2C2C2A">The GSP-RM role</text>
<text x="366" y="120" font-size="11" fill="#5F5E5A">boot exchange, message queue, every RPC:</text>
<text x="366" y="134" font-size="11" fill="#5F5E5A">answered, forwarded to the host RM, or refused</text>

<rect x="356" y="156" width="268" height="58" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="366" y="174" font-size="12" font-weight="500" fill="#2C2C2A">BAR0 model and PCI config space</text>
<text x="366" y="190" font-size="11" fill="#5F5E5A">boot ids, falcons, PROM window with the</text>
<text x="366" y="204" font-size="11" fill="#5F5E5A">synthetic VBIOS, interrupt tree, display FE</text>

<rect x="356" y="226" width="268" height="58" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="366" y="244" font-size="12" font-weight="500" fill="#2C2C2A">Shadow page tables</text>
<text x="366" y="260" font-size="11" fill="#5F5E5A">a leaf is admitted only inside the VRAM slice</text>
<text x="366" y="274" font-size="11" fill="#5F5E5A">or registered guest RAM; the rest faults</text>

<rect x="356" y="296" width="268" height="58" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="366" y="314" font-size="12" font-weight="500" fill="#2C2C2A">Reactor thread</text>
<text x="366" y="330" font-size="11" fill="#5F5E5A">polls the token eventfds, applies pending</text>
<text x="366" y="344" font-size="11" fill="#5F5E5A">shadow plans, rings the host doorbell</text>

<rect x="356" y="366" width="268" height="58" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="366" y="384" font-size="12" font-weight="500" fill="#2C2C2A">Mirror channels</text>
<text x="366" y="400" font-size="11" fill="#5F5E5A">per guest TSG and channel a host TSG and</text>
<text x="366" y="414" font-size="11" fill="#5F5E5A">channel on a shadow VA space; software executor</text>

<rect x="356" y="436" width="268" height="70" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="366" y="454" font-size="12" font-weight="500" fill="#2C2C2A">Display in the GSP role</text>
<text x="366" y="470" font-size="11" fill="#5F5E5A">DisplayPort connector, EDID over AUX, link</text>
<text x="366" y="484" font-size="11" fill="#5F5E5A">training, vblank and flip completion on the</text>
<text x="366" y="498" font-size="11" fill="#5F5E5A">device's clock; nothing scans out physically</text>

<!-- Host column -->
<rect x="670" y="50" width="250" height="470" rx="12" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="686" y="72" font-size="13" font-weight="500" fill="#085041">Host driver and GPU</text>

<rect x="686" y="86" width="218" height="58" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="696" y="104" font-size="12" font-weight="500" fill="#2C2C2A">Host RM, /dev/nvidiactl</text>
<text x="696" y="120" font-size="11" fill="#5F5E5A">an unprivileged client; CAP_SYS_ADMIN</text>
<text x="696" y="134" font-size="11" fill="#5F5E5A">raised on one thread for three controls</text>

<rect x="686" y="156" width="218" height="58" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="696" y="174" font-size="12" font-weight="500" fill="#2C2C2A">VRAM slice</text>
<text x="696" y="190" font-size="11" fill="#5F5E5A">one fixed, contiguous reservation at the</text>
<text x="696" y="204" font-size="11" fill="#5F5E5A">top of the FB; guest address = host address</text>

<rect x="686" y="226" width="218" height="58" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="696" y="244" font-size="12" font-weight="500" fill="#2C2C2A">Registered guest RAM</text>
<text x="696" y="260" font-size="11" fill="#5F5E5A">OS descriptors over the guest memfd,</text>
<text x="696" y="274" font-size="11" fill="#5F5E5A">pinned; one IOVA range per chunk</text>

<rect x="686" y="296" width="218" height="58" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="696" y="314" font-size="12" font-weight="500" fill="#2C2C2A">Host channels</text>
<text x="696" y="330" font-size="11" fill="#5F5E5A">run the guest's pushbuffers; completions</text>
<text x="696" y="344" font-size="11" fill="#5F5E5A">come back as RM events</text>

<rect x="686" y="366" width="218" height="58" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="696" y="384" font-size="12" font-weight="500" fill="#2C2C2A">The GPU</text>
<text x="696" y="400" font-size="11" fill="#5F5E5A">walks the shadow tables, never a guest</text>
<text x="696" y="414" font-size="11" fill="#5F5E5A">table; shared with the host desktop</text>

<rect x="686" y="436" width="218" height="70" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="696" y="454" font-size="12" font-weight="500" fill="#2C2C2A">What the host never sees</text>
<text x="696" y="470" font-size="11" fill="#5F5E5A">a guest comptag line, a guest address</text>
<text x="696" y="484" font-size="11" fill="#5F5E5A">outside the slice, a register write,</text>
<text x="696" y="498" font-size="11" fill="#5F5E5A">a fault that leaves the VM's own channels</text>

<!-- Arrows guest to device -->
<line x1="294" y1="185" x2="354" y2="185" stroke="#B3261E" stroke-width="1.5" marker-end="url(#arrow-trap)"/>
<line x1="294" y1="255" x2="354" y2="255" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-mem)"/>
<line x1="294" y1="325" x2="354" y2="325" stroke="#4A6FA5" stroke-width="1.5" marker-end="url(#arrow-fd)"/>
<line x1="354" y1="471" x2="294" y2="471" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Arrows device to host -->
<line x1="624" y1="115" x2="684" y2="115" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="624" y1="325" x2="684" y2="325" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="684" y1="395" x2="624" y2="395" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Legend -->
<line x1="36" y1="548" x2="76" y2="548" stroke="#B3261E" stroke-width="1.5" marker-end="url(#arrow-trap)"/>
<text x="86" y="552" font-size="11" fill="#2C2C2A">trap: KVM exit, Cloud Hypervisor, vfio-user socket, the device; 25 to 40 us per access</text>
<line x1="36" y1="570" x2="76" y2="570" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-mem)"/>
<text x="86" y="574" font-size="11" fill="#2C2C2A">memory: a mapped page, no exit; the device syncs it at the next trapped access or doorbell</text>
<line x1="36" y1="592" x2="76" y2="592" stroke="#4A6FA5" stroke-width="1.5" marker-end="url(#arrow-fd)"/>
<text x="86" y="596" font-size="11" fill="#2C2C2A">ioeventfd: one KVM exit ending in an eventfd, 1 to 2 us; no VMM and no socket message</text>
<line x1="560" y1="548" x2="600" y2="548" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="610" y="552" font-size="11" fill="#2C2C2A">RM calls and events between the device and the host driver</text>
</g>
</svg>
