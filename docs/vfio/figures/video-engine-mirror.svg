<svg width="720" height="430" viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Video engine mirror</title>
<desc>The guest's NVENC channel is built on the host at its first doorbell and bound to NVENC0. The guest's encoder object is placed on the host only after the guest's context page has left the shadow VA space, so the host's context lands in that hole.</desc>
<rect x="0" y="0" width="720" height="430" fill="#FFFFFF"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif">
<rect x="20" y="20" width="250" height="390" rx="16" fill="#EEEDFE" stroke="#534AB7"/>
<text x="36" y="44" font-size="14" font-weight="500" fill="#3C3489">Guest (610 or 615 driver)</text>
<rect x="450" y="20" width="250" height="390" rx="16" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="466" y="44" font-size="14" font-weight="500" fill="#085041">Host RM (device process)</text>
<text x="360" y="44" font-size="13" font-weight="500" fill="#444441" text-anchor="middle">device</text>

<rect x="36" y="64" width="218" height="46" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="46" y="84" font-size="12" fill="#2C2C2A">1. channel, engineType NVENC0</text>
<text x="46" y="100" font-size="11" fill="#5F5E5A">no TSG, device default VAS</text>
<rect x="466" y="64" width="218" height="46" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="476" y="84" font-size="12" fill="#2C2C2A">own TSG + channel on the</text>
<text x="476" y="100" font-size="11" fill="#5F5E5A">shadow VAS, BIND NVENC0</text>
<line x1="254" y1="87" x2="464" y2="87" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="360" y="80" font-size="11" fill="#444441" text-anchor="middle">first doorbell</text>

<rect x="36" y="128" width="218" height="46" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="46" y="148" font-size="12" fill="#2C2C2A">2. first push; the guest</text>
<text x="46" y="164" font-size="11" fill="#5F5E5A">waits for it to complete</text>
<rect x="466" y="128" width="218" height="46" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="476" y="148" font-size="12" fill="#2C2C2A">runs on the host NVENC</text>
<text x="476" y="164" font-size="11" fill="#5F5E5A">completion: vector 9</text>
<line x1="254" y1="151" x2="464" y2="151" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="464" y1="163" x2="254" y2="163" stroke="#444441" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<rect x="36" y="192" width="218" height="46" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="46" y="212" font-size="12" fill="#2C2C2A">3. GPU_PROMOTE_CTX</text>
<text x="46" y="228" font-size="11" fill="#5F5E5A">context VA 0x12002d000</text>
<rect x="292" y="192" width="136" height="46" rx="8" fill="#FAEEDA" stroke="#BA7517"/>
<text x="302" y="212" font-size="12" fill="#633806">range leaves set A</text>
<text x="302" y="228" font-size="11" fill="#854F0B">unmap, wait</text>
<line x1="254" y1="215" x2="290" y2="215" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="36" y="256" width="218" height="46" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="46" y="276" font-size="12" fill="#2C2C2A">4. alloc NVC4B7</text>
<text x="46" y="292" font-size="11" fill="#5F5E5A">(deferred on the device)</text>
<rect x="466" y="256" width="218" height="46" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="476" y="276" font-size="12" fill="#2C2C2A">NVC4B7 allocated; its context</text>
<text x="476" y="292" font-size="11" fill="#5F5E5A">first fit = the guest's hole</text>
<line x1="254" y1="279" x2="464" y2="279" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="36" y="320" width="218" height="74" rx="8" fill="#FCEBEB" stroke="#A32D2D"/>
<text x="46" y="340" font-size="12" font-weight="500" fill="#791F1F">Rejected</text>
<text x="46" y="357" font-size="11" fill="#791F1F">hold doorbell 1 until step 4:</text>
<text x="46" y="372" font-size="11" fill="#791F1F">deadlock (the guest waits at 2)</text>
<text x="46" y="387" font-size="11" fill="#791F1F">object at doorbell 1: Xid 31</text>
<rect x="466" y="320" width="218" height="74" rx="8" fill="#FCEBEB" stroke="#A32D2D"/>
<text x="476" y="340" font-size="12" font-weight="500" fill="#791F1F">Rejected</text>
<text x="476" y="357" font-size="11" fill="#791F1F">reserve every free VA first:</text>
<text x="476" y="372" font-size="11" fill="#791F1F">3576 RM calls, NO_MEMORY storm,</text>
<text x="476" y="387" font-size="11" fill="#791F1F">host VRAM 431 MiB, desktop froze</text>
</g>
</svg>
