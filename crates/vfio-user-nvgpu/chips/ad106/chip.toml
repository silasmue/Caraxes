#
# Costume ladder rung 3 (docs/caraxes/costume-ladder.md): AD106, the RTX 4060 Ti's chip
# (Ada), presented over the TU106 of the house, the same way as chips/ga106 (an overlay on
# chips/tu106, src/chip/derived.rs). Paths are relative to vendor/open-gpu-kernel-modules at
# 610.57.04; no AD106 was ever read, every value comes from the open tree.
base = "tu106"
name = "ad106"
short_name = "AD106"

# NV_PMC_BOOT_0/BOOT_42 of AD106 revision A1: architecture 0x19 (AD100 family,
# NV2080_CTRL_MC_ARCH_INFO_ARCHITECTURE_AD100 0x190, ctrl2080mc.h:79) and implementation 6
# (_IMPLEMENTATION_AD106, ctrl2080mc.h:131). The revision A1 is invented (TU106's).
[identity]
boot_0 = 0x1960_00A1
boot_1 = 0x0000_0000
boot_42 = 0x196A_1000

# Ada keeps AMPERE_CHANNEL_GPFIFO_A and AMPERE_DMA_COPY_B; ADA_COMPUTE_A (clc9c0.h)
# (g_gpu_class_list.c:1767-1841). The mirror maps them to TU106's
# (boards/rtx4060ti-on-tu106.toml `class_map`).
[channel]
gpfifo = 0xC56F
copy = 0xC7B5
uvm_sw = 0xC076
compute = 0xC9C0

[classes]
source = "g_gpu_class_list.c:32-54, 1714-1764, 1767-1841 of 610.57.04 (generic, AD106 no-engine and engine lists)"
