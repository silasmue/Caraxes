#
# The TU106 display engine as the device presents it (docs/caraxes/display-ab.md,
# display-adapter.md sections 3-5, display-scaling.md section 3.1). Values are Turing
# header resets or choices for the emulated display (4 heads, 8 windows, 4 SORs),
# except the IHUB resource geometry, captured from the card as documented below.
# The board's connectors live in boards/<board>.toml [display].

label = "synthesized (TU106 display engine data, chips/tu106/display.toml)"

# INTERNAL_DISPLAY_GET_IP_VERSION: display IP v04.00 (Turing; display-path.md §2).
ip_version = 0x0400_0000
heads = 4
windows = 8
sors = 4
# NV_UDISP_FE_CHN_ASSY_BASEADR__SIZE_1 (disp/v03_00/dev_disp.h): core, 32 windows,
# 32 window-imm, 8 cursors, and the gap between them.
num_disp_channels = 81
# NV402C_CTRL_NUM_I2C_PORTS: "no external device" (kern_disp.c:611-623).
i2c_port = 16
# NV_PDISP_VGA_WORKSPACE_BASE (0x625F04): STATUS (bit 3) invalid, so the kernel keeps
# the VGA workspace at fbSize - 1 MiB, the layout it computes without a display
# (kernel_gsp_tu102.c:787-802, fb-model.md §3.1).
vga_workspace_base = 0
# The display interrupt vector in leaf 4 (vectors 128-159, intr_tu102.c:1191-1212); it
# appears in chips/tu106/interrupts.toml as MC_ENGINE_IDX_DISP.
intr_vector = 156
# The GSP stall vector of interrupts.toml: raised with GSP IRQSTAT.SWGEN0 after the
# device posts NV2080_NOTIFIERS_HOTPLUG on the status queue (phase D, display-cd.md).
gsp_vector = 192
# Per-head pixel clock cap: the NVKMS HEAD_CLK_CAP workaround value 0x85 (133) in
# 10 MHz units (nvkms-evo3.c:5181-5200), used by IS_MODE_POSSIBLE.
head_clk_cap_khz = 1330000

# The DisplayPort link the GPU side offers (NV0073 DP_GET_CAPS, DFP_GET_INFO, DP_CTRL,
# DP_GET_LINK_CONFIG) and the sink profile must agree with (dp-sink
# SinkProfile::dp14_hbr3_x4_dsc): one profile, D15, display-adapter.md §7 item 3.
[link]
rate = "HBR3"
lanes = 4
dsc = true
fec = true

# The NVC573 capabilities page at BAR0 0x640000 (4096 bytes, clc573.h), as the TU106
# answers it: caraxes/reference/rtx2070/display-caps-2026-09-27.txt (the RTX 2070 under host
# RM 615.71.09, READ_32 only). Offsets are relative to 0x640000; every dword not listed reads
# 0, as on the card (NVKMS reads the precomp caps of all 32 windows; windows 8-31 are 0).
# Every nonzero dword of the capture is served, including those clc573.h does not name,
# with two exceptions for features the model does not have:
# - IHUB_COMMON_CAPA keeps the mempool geometry, SUPPORT_PLANAR and the request size, not
#   the card's VGA, mempool-compression, MSCG, MCLK-switch and bit-24 bits;
# - POSTCOMP_HEAD_HDR_CAPB(0) omits VGA (0:0), the head that scans out the VGA console.
# HEAD_CLK_CAP and SOR_CLK_CAP read 0 at clc573.h's offsets (0x5e8, 0x608) on the card, as
# NVKMS expects of Turing (nvkms-evo3.c:5181-5200); IS_MODE_POSSIBLE uses head_clk_cap_khz.
# The earlier synthesized page (NVKMS-shaped: no scalers, no pipe widths, every CSC stage on
# every window) left the window pipes without FULL_WIDTH/UNIT_WIDTH and the scaler line
# limits at 0, unlike any TU106; the Windows KMD accepted flips on it but never programmed a
# window (docs/research/windows-findings.md, CH step 4: the suspected cause).
[[caps]]
offset = 0x000
name = "SYS_CAP"
value = 0x00000f0f
[[caps]]
offset = 0x004
name = "SYS_CAPB"
value = 0x000000ff
[[caps]]
offset = 0x00c
name = "not named in clc573.h"
value = 0x00000100
[[caps]]
offset = 0x010
name = "IHUB_COMMON_CAPA"
value = 0x800a1400  # the card: 0x81fa1400 (VGA, compression, MSCG, MCLK switch, bit 24 omitted)
[[caps]]
offset = 0x018
name = "IHUB_COMMON_CAPC (clc673.h and later; not in clc573.h)"
