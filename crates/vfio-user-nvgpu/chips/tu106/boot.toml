#
# The TU106 firmware-boot model (src/chip/turing.rs): the registers and constants of
# the GFW, FWSEC-FRTS, Booter and GSP RISC-V side effects the CPU checks, without any
# firmware running (docs/caraxes/gsp-boot-turing.md, init-map.md phase 4,
# experiments.md E2). The same HALs serve GA10x and AD10x
# (docs/caraxes/other-architectures.md §1-2).

# The two falcon blocks (dev_falcon_v4.h, dev_fbif_v4.h, dev_riscv_pri.h): IMEM/DMEM
# sizes in 256-byte blocks as HWCFG reports them. After GFW boot the GSP falcon sits
# halted; the CPU checks that first.
# HWCFG, HWCFG1 and ITFEN are the host RTX 2070's (read-only capture of 2026-09-25): HWCFG
# holds the same IMEM/DMEM block counts (8:0, 17:9) as the sizes here.
gsp = { base = 0x0011_0000, imem_blocks = 0x100, dmem_blocks = 0x100, riscv = true, halted = true, hwcfg = 0x4042_0100, hwcfg1 = 0xCA10_1136, itfen = 0x1004 }
sec2 = { base = 0x0084_0000, imem_blocks = 0x100, dmem_blocks = 0x100, riscv = false, halted = false, hwcfg = 0x4042_0100, hwcfg1 = 0xCA10_1136, itfen = 0x1007 }
# The PMU falcon (0x10A000-0x10AFFF, FBIF at +0xE00, no RISC-V block), driven only by the
# CPU-RM path of the Windows driver (the ACR unload; caraxes/runs/win11-2026-09-25/
# night-2026-09-25/ANALYSIS-gsp-path.md). Reset through NV_PMC_ENABLE bit 13 (nouveau
# gk104_mc_reset); a start raises IRQSTAT HALT.
pmu = { base = 0x0010_A000, imem_blocks = 0x100, dmem_blocks = 0x100, riscv = false, halted = false, hwcfg = 0x400E_0100, hwcfg1 = 0xEA10_4136, itfen = 0x5, fbif = 0xE00, block_size = 0x1000, halt_irq = true, pmc_enable_bit = 13 }
# NV_PMC_ENABLE (tu102/dev_mc.h), watched for the PMU reset.
pmc_enable = 0x0000_0200
# Falcon, FBIF and the RISC-V block at +0x1000.
falcon_block_size = 0x2000
# NV_PGSP_QUEUE_HEAD(0): the command-queue doorbell (kgspSetCmdQueueHead_TU102).
gsp_queue_head = 0x0011_0C00
# From driver 615 the pointers of both message queues live in registers
# (docs/caraxes/gsp-transport-615.md §2): the CPU writes the command queue's write
# pointer to QUEUE_HEAD(0) above and the status queue's read pointer to MSGQ_TAIL(0), and
# reads the GSP's from QUEUE_TAIL(0) and MSGQ_HEAD(0) (turing/tu102/dev_gsp.h:38-47,
# kern_gpu_tu102.c:596-605 of 615).
gsp_queue_tail = 0x0011_0C04
gsp_msgq_head = 0x0011_0C80
gsp_msgq_tail = 0x0011_0C84

# NV_PFB_PRI_MMU_LOCAL_MEMORY_RANGE, encoded as kern_mem_sys_gp102.c:47-50.
local_memory_range = 0x0010_0CE0
# NV_PFB_PRI_MMU_WPR2_ADDR_LO/HI (dev_fb.h:42; kgspIsWpr2Up_TU102).
wpr2_addr_lo = 0x001F_A824
wpr2_addr_hi = 0x001F_A828
# NV_PFB_PRI_MMU_WPR1_ADDR_LO/HI: 0 until an ACR sets WPR1 (none does in the model); the
# ACR unload on the PMU (BOOTVEC 0x10000, linux-firmware nvidia/tu102/acr/unload_bl.bin
# at IMEM tag 0x100) clears WPR1 and WPR2 (ANALYSIS-gsp-path.md §3 change 4).
wpr1_addr_lo = 0x001F_A81C
wpr1_addr_hi = 0x001F_A820
acr_unload_bootvec = 0x1_0000

# `kgspGetFrtsSize` on TU10x (docs/caraxes/gsp-boot-turing.md); used for the WPR2 high
# address and for the fallback when guest RAM cannot be read.
frts_size = 0x10_0000
# Offset of `dataDmaBase` in `RM_FLCN_BL_DMEM_DESC` (rmflcnbl.h:89), a raw 64-bit
# physical address split in two 32-bit words.
bl_desc_data_dma_base = 0x40
# Where the FWSEC data image built by `caraxes/tools/synth-vbios.py` keeps the FRTS
# command's `frtsRegionOffset4K` (docs/caraxes/vbios-synthesis.md §d).
fwsec_data_frts_offset_4k = 0xA0
# `kgspCalculateFbLayout_TU102` with no display: the VGA workspace is the last 1 MiB,
# `gspFwWprEnd` is that offset aligned down to 128 KiB, and FRTS sits just below it
# (kernel_gsp_tu102.c:800-820).
vga_workspace_size = 0x10_0000
wpr_end_align = 0x2_0000

# Registers that read a fixed post-GFW value; writes are dropped ("read-only").
const = [
    # Level 0 may write PTIMER_TIME_0/1 (timer_gv100.c:56); all levels enabled.
    { name = "NV_PTIMER_TIME_PRIV_LEVEL_MASK", offset = 0x0000_9430, value = 0xFF },
    { name = "NV_PBUS_VBIOS_SCRATCH(0xE)", offset = 0x0000_1438, value = 0 },
    { name = "NV_PBUS_VBIOS_SCRATCH(0x15)", offset = 0x0000_1454, value = 0 },
    # DATA_ENABLE is 0 (gm107/dev_fuse.h:29): TU106 has a display engine. The display
    # model (src/display) answers this register first: 0 with --display, 1 (no display,
    # the headless profile of E0-E5) without it.
    { name = "NV_FUSE_STATUS_OPT_DISPLAY", offset = 0x0002_1C04, value = 0 },
    # Production part: `_DATA_NO` = 1 is "debug disabled" (kernel_gsp_ga100.c:46-48).
    { name = "NV_FUSE_OPT_SECURE_GSP_DEBUG_DIS", offset = 0x0002_174C, value = 1 },
    # FWSEC lowered the read-protection PLM (kern_gpu_tu102.c:395-417).
    { name = "NV_PGC6_AON_SECURE_SCRATCH_GROUP_05_PRIV_LEVEL_MASK", offset = 0x0011_8128, value = 1 },
    # GFW_BOOT_PROGRESS_COMPLETED (dev_gc6_island_addendum.h:32).
    { name = "NV_PGC6_AON_SECURE_SCRATCH_GROUP_05(0) GFW_BOOT", offset = 0x0011_8234, value = 0xFF },
]
