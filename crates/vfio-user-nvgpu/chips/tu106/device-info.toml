#
# The TU106 FIFO device-info table, the answer to FIFO_GET_DEVICE_INFO_TABLE
# (ctrl2080fifo.h:535-576; docs/caraxes/fifo-device-info.md and
# caraxes/tools/fifo-table-tu106.json). Engines, MMU fault ids and PBDMA counts come
# from the host card (unprivileged controls); runlist ids, PBDMA ids and PBDMA fault
# ids are synthesized under the kernel's constraints; mc_idx is the MC_ENGINE_IDX (an
# array index in the guest). An empty table removes KernelGraphics and crashes the
# guest in memmgrCalcReservedFbSpaceHal_GM107, so GR0 must be present.
#
# eng_desc = [NVOC class of the physical engine, instance] (ENG_DESC = class id << 8
# | instance, g_eng_desc_nvoc.h:55-59); rm_engine_type is the RM_ENGINE_TYPE and mc
# the MC_ENGINE_IDX, by name (numbers from src/ver). dev_type is the hardware
# device-info type (19 = LCE). pbdma = [[PBDMA id, PBDMA fault id], ...].

label = "host (engines, fault ids, PBDMA counts) + synthesized (runlists, PBDMA ids; fifo-device-info.md)"

