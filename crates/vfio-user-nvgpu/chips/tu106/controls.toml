#
# TU106: answers to category A controls ("pure chip data", docs/caraxes/gsp-surface.md
# §3.A), one [[control]] per control, served by the table-driven handler of
# src/chipctl.rs. The handler starts from a zeroed parameter block of the request's size,
# copies the `inputs` back from the request, writes `fields` (and the `fields` of the first
# `case` whose `when` matches the request), and answers NV_OK with the entry's label (D9:
# `card` where a capture of the real RTX 2070 supplied the value, `chip` where the chip's
# own tables or its source do, `board` for board data). A request no case matches is not
# answered by the table (it falls through to the dispatcher's default, NOT_SUPPORTED).
#
#   name     the control, resolved to its id through the version's surface table
#            (src/ver/v<major>/surface.rs); it must be a routed category A control
#   params   the parameter struct; fields are resolved by name through the version's
#            compiler-measured layout table (src/ver/v<major>/ctrl_layouts.rs,
#            caraxes/tools/ctrl-layouts.py), never by typed offsets
#   fields   "path" = value; a path names a scalar (`numEntries`, `capsTbl[4]`,
#            `entries[2].nv2080EngineType`); a value is a number or "ENUM:NAME" for a
#            driver enum the version module knows (NV2080_ENGINE_TYPE, RM_ENGINE_TYPE,
#            MC_ENGINE_IDX, NV2080_INTR_CATEGORY)
#   abi      the guest ABIs the entry applies to (default both, "610" and "615")
#
# The trace paths are the native control traces of the RTX 2070 on driver 610.57.04
# (matrix/traces/610.57.04/control/<probe>.jsonl:<line of the `out` record>); the control
# ids and layouts of these entries are the same in 615.71.09.

# Vulkan device enumeration and NVDEC (docs/caraxes/gsp-surface.md §6 item 7). capsTbl
# bytes 0 and 4 set, the rest 0, for instance 0 in all six captures.
[[control]]
name = "NV0080_CTRL_CMD_NVDEC_GET_CAPS_V2"
params = "NV0080_CTRL_NVDEC_GET_CAPS_PARAMS_V2"
inputs = ["instanceId"]
label = "card (NVDEC caps table 01 00 00 00 16 00 00 00; native traces nvdec.jsonl:2192, vk-enum.jsonl:590)"
fields = { "capsTbl[0]" = 0x01, "capsTbl[4]" = 0x16 }

# NVENC: the card's 6-byte caps table is all zero (NV0080_CTRL_CMD_NVENC_GET_CAPS 0x801B01,
# whose nested table the tracer dumps: capsTblSize 6, nested 000000000000;
# nvdec.jsonl:2195, vk-enum.jsonl:593); the V2 form carries the same table inline.
[[control]]
name = "NV0080_CTRL_CMD_NVENC_GET_CAPS_V2"
params = "NV0080_CTRL_NVENC_GET_CAPS_V2_PARAMS"
inputs = ["instanceId"]
label = "card (NVENC caps table all zero; native traces nvdec.jsonl:2195, vk-enum.jsonl:593, the V1 control)"

# The ZBC clear table ranges every GL, EGL and Vulkan client queries (§6 item 4): indices
# 1 to 15 for colour, depth and stencil (ctrl9096.h:372-376: COLOR 1, DEPTH 2, STENCIL 3),
# identical in all 72 captures (e.g. gl-enum.jsonl:1465, 1513, 1561).
[[control]]
name = "NV9096_CTRL_CMD_GET_ZBC_CLEAR_TABLE_SIZE"
params = "NV9096_CTRL_GET_ZBC_CLEAR_TABLE_SIZE_PARAMS"
inputs = ["tableType"]
label = "card (ZBC table indices 1-15 per type; native traces gl-enum.jsonl:1465, 1513, 1561)"
[[control.case]]
when = { tableType = 1 }
fields = { indexStart = 1, indexEnd = 15 }
[[control.case]]
when = { tableType = 2 }
fields = { indexStart = 1, indexEnd = 15 }
[[control.case]]
when = { tableType = 3 }
fields = { indexStart = 1, indexEnd = 15 }

# The interrupt subtree of each category (ctrl2080mc.h:337-369): the same map the device
# gives the kernel in INTERNAL_INTR_GET_KERNEL_TABLE (chips/tu106/interrupts.toml
# `subtree`; categories ESCHED_DRIVEN_ENGINE 1, ESCHED_DRIVEN_ENGINE_NOTIFICATION 2,
# UVM_OWNED 5, UVM_SHARED 6). chipctl.rs's tests check the two agree.
[[control]]
name = "NV2080_CTRL_CMD_MC_GET_INTR_CATEGORY_SUBTREE_MAP"
params = "NV2080_CTRL_MC_GET_INTR_CATEGORY_SUBTREE_MAP_PARAMS"
label = "chip (the subtree map of chips/tu106/interrupts.toml)"
fields = { "subtreeMap[1].subtreeMask" = 0x8, "subtreeMap[2].subtreeMask" = 0x1, "subtreeMap[5].subtreeMask" = 0x2, "subtreeMap[6].subtreeMask" = 0x4 }

# The static (non-engine) interrupts of the device (ctrl2080mc.h:276-328; NV2080_INTR_TYPE
# NON_REPLAYABLE_FAULT 1, REPLAYABLE_FAULT 4, ACCESS_CNTR 6, TMR 7 at :298-305), with the
# vectors chips/tu106/interrupts.toml gives the same interrupts; pmcIntrMask 0 (Turing
# routes by vector). Only the static interrupts the device raises are listed.
[[control]]
name = "NV2080_CTRL_CMD_MC_GET_STATIC_INTR_TABLE"
params = "NV2080_CTRL_MC_GET_STATIC_INTR_TABLE_PARAMS"
label = "chip (the static interrupts of chips/tu106/interrupts.toml)"
[control.fields]
numEntries = 4
"entries[0].nv2080IntrType" = 1
"entries[0].intrVectorStall" = 195
"entries[1].nv2080IntrType" = 4
"entries[1].intrVectorStall" = 64
"entries[2].nv2080IntrType" = 6
"entries[2].intrVectorStall" = 65
"entries[3].nv2080IntrType" = 7
"entries[3].intrVectorStall" = 194
"entries[3].intrVectorNonStall" = 3

# The non-stall (notification) vector of each engine that has one in the device's
# interrupt layout (ctrl2080mc.h:243-274): GR0 and CE2-CE4, the engines the host mirror
# runs (chips/tu106/interrupts.toml, E5b part 2).
[[control]]
name = "NV2080_CTRL_CMD_MC_GET_ENGINE_NOTIFICATION_INTR_VECTORS"
params = "NV2080_CTRL_MC_GET_ENGINE_NOTIFICATION_INTR_VECTORS_PARAMS"
label = "chip (the engine non-stall vectors of chips/tu106/interrupts.toml)"
[control.fields]
numEntries = 4
"entries[0].nv2080EngineType" = "NV2080_ENGINE_TYPE:GR0"
"entries[0].notificationIntrVector" = 4
"entries[1].nv2080EngineType" = "NV2080_ENGINE_TYPE:COPY2"
"entries[1].notificationIntrVector" = 5
"entries[2].nv2080EngineType" = "NV2080_ENGINE_TYPE:COPY3"
"entries[2].notificationIntrVector" = 6
"entries[3].nv2080EngineType" = "NV2080_ENGINE_TYPE:COPY4"
"entries[3].notificationIntrVector" = 7

# No decompression LCE on Turing (chip.toml [ce] decomp_lce = false; kernel_ce.c of 610
# :1172-1197): the mask is 0 for every shim instance.
[[control]]
name = "NV2080_CTRL_CMD_CE_GET_DECOMP_LCE_MASK"
params = "NV2080_CTRL_CE_GET_DECOMP_LCE_MASK_PARAMS"
inputs = ["shimInstance"]
label = "chip (no decompression LCE on Turing, chip.toml [ce])"

# CE0 and CE1 are the graphics CEs on GR's runlist 0; CE2 is the first CE with a runlist
# of its own (chips/tu106/device-info.toml: ce0/ce1 runlist 0, ce2 runlist 1).
[[control]]
name = "NV2080_CTRL_CMD_GPU_GET_FIRST_ASYNC_CE_IDX"
params = "NV2080_CTRL_GPU_GET_FIRST_ASYNC_CE_IDX_PARAMS"
label = "chip (first async CE is CE2, chips/tu106/device-info.toml)"
fields = { firstAsyncCEIdx = 2 }

# ---------------------------------------------------------------------------------------
# Five controls the GSP surface inventory sorts into category B that are chip or board data
# (docs/caraxes/gsp-plan/b-host-forwardable.md §3 S): `moved_from = "B"` names the
# inventory's category, which chipctl.rs accepts in place of A for these rows only.

# FIPS mode is a Hopper+ Confidential Computing platform mode; TU106 has none (plan §2 row
# 14). PRIVILEGED on the host, so the unprivileged host client could not forward it.
[[control]]
name = "NV2080_CTRL_GPU_GET_FIPS_STATUS"
params = "NV2080_CTRL_GPU_GET_FIPS_STATUS_PARAMS"
moved_from = "B"
label = "chip (no FIPS mode on TU106: bFipsEnabled 0)"

# The UEFI image of the VBIOS the guest reads through the PROM window: the synthesized image
# keeps the captured EFI image (code type 3 at 0xEC00, docs/caraxes/vbios-synthesis.md §1),
# so PRESENCE_YES (flags 1:0 = 1, ctrl2080bios.h:470-472). RUNNING (2:2) and IS_EFI_INIT
# (3:3) are 0: no UEFI GOP runs on the emulated function (the VM boots its kernel directly).
# The version is 0: the device does not parse it from the image (Q-B5 open).
[[control]]
name = "NV2080_CTRL_CMD_BIOS_GET_UEFI_SUPPORT"
params = "NV2080_CTRL_BIOS_GET_UEFI_SUPPORT_PARAMS"
moved_from = "B"
label = "board (the synthesized VBIOS carries the captured EFI image: present, not running; version not parsed)"
fields = { flags = 1 }

# The error interrupt register of a GF100_SUBDEVICE_MASTER mapping and the ECC and NVLink
# bits in it (ctrl90e6.h:65-97). This GeForce board has no ECC and TU106 no NVLink, so both
# masks are 0 and no read of `offset` can signal an error; `offset` stays 0. A Turing NVML
# expects an answer (rmapi_utils.c:245-247 silences the refusal only below Turing).
[[control]]
name = "NV90E6_CTRL_CMD_MASTER_GET_ERROR_INTR_OFFSET_MASK"
params = "NV90E6_CTRL_MASTER_GET_ERROR_INTR_OFFSET_MASK_PARAMS"
moved_from = "B"
label = "chip (no ECC, no NVLink: every error mask 0)"

# The VF error-containment masks (ctrl90e6.h:101-135): no ECC and no NVLink, both 0.
[[control]]
name = "NV90E6_CTRL_CMD_MASTER_GET_VIRTUAL_FUNCTION_ERROR_CONT_INTR_MASK"
params = "NV90E6_CTRL_MASTER_GET_VIRTUAL_FUNCTION_ERROR_CONT_INTR_MASK_PARAMS"
moved_from = "B"
label = "chip (no ECC, no NVLink: both masks 0)"

# Kernel-privileged (flags 0x40) with no caller in the Linux tree (plan §2 row 24). The Windows
# KMD sizes its graphics-preemption pool with it: src/recorded.rs answers it ahead of this table
# (recorded::OVERRIDES), so this refusal is never reached; it stays for the ABI inventory.
[[control]]
name = "NV2080_CTRL_CMD_GR_GFX_POOL_QUERY_SIZE"
params = "NV2080_CTRL_GR_GFX_POOL_QUERY_SIZE_PARAMS"
moved_from = "B"
status = "NOT_SUPPORTED"
label = "refused (no caller in either tree: kernel-privileged GR_GFX_POOL_QUERY_SIZE, E by gsp-plan B)"
# ---- The category D rows the plan moves to A (docs/caraxes/gsp-plan/d-device-model.md §3
# and §7, d-controls.tsv `reclass` A). They are D in the inventory; the table takes them
# because the D rule table (src/ver/v<major>/dmodel.rs) marks them A. `open` rows name the
# source that would supply the value; until then they are not answered (NOT_SUPPORTED,
# `unanswered`).

# 0x20800A3E is the legacy, non-KGR form of the static FECS trace getter (plan §3): the same
# answer as 0x20800A3F, which kgr.rs refuses on purpose while FECS tracing is off
# (src/kgr.rs:452-458; a refusal leaves pFecsTraceDefines NULL, 615
# src/nvidia/src/kernel/gpu/gr/kernel_graphics.c:1492-1502). The kernel never sends 0x3E.
[[control]]
name = "subdeviceCtrlCmdGrStaticGetFecsTraceDefines"
params = "NV2080_CTRL_INTERNAL_STATIC_GR_GET_FECS_TRACE_DEFINES_PARAMS"
label = "chip (FECS tracing off: the answer of 0x20800A3F, kgr.rs:452)"
status = "NOT_SUPPORTED"

# No SLI or framelock connector on the board: chip.toml [features] names the SLI bridge
# (nvlink_sli) and the G-SYNC board (gsync) absent, so there are no pinsets and no pinset
# maps to scan-lock pins (615 ctrl/ctrl5070/ctrl5070chnc.h:744, ctrl2080internal.h:3467).
[[control]]
name = "NV5070_CTRL_CMD_GET_PINSET_COUNT"
params = "NV5070_CTRL_GET_PINSET_COUNT_PARAMS"
inputs = ["base.subdeviceIndex"]
label = "board (no SLI or framelock connector: chip.toml [features] nvlink_sli and gsync absent)"
fields = { pinsetCount = 0 }

[[control]]
name = "NV2080_CTRL_CMD_INTERNAL_DISP_PINSETS_TO_LOCKPINS"
params = "NV2080_CTRL_INTERNAL_DISP_PINSETS_TO_LOCKPINS_PARAMS"
inputs = ["pinSetIn", "pinSetOut"]
label = "board (no pinsets: no scan lock through a pin; chip.toml [features] nvlink_sli and gsync absent)"
fields = { bMasterScanLock = 0, bSlaveScanLock = 0 }

# Open: the value is a lookup in RM's adaptive-sync default list, keyed by the EDID
# manufacturer and product id (615 ctrl/ctrl0073/ctrl0073specific.h:3036-3049), closed firmware.
[[control]]
name = "NV0073_CTRL_CMD_SPECIFIC_DEFAULT_ADAPTIVESYNC_DISPLAY"
params = "NV0073_CTRL_SPECIFIC_DEFAULT_ADAPTIVESYNC_DISPLAY_PARAMS"
label = "board"
open = "RM's default adaptive-sync list: the host read of d-device-model.md §8 Q12 with the synthetic EDID's manufacturer and product id (expected FALSE)"

# Open: the VBIOS DP drive tables of the card (615 ctrl/ctrl0073/ctrl0073dp.h:1008, :3314).
# The ROM is captured (caraxes/reference/rtx2070/rom.bin) but its DP tables are not parsed.
[[control]]
name = "NV0073_CTRL_CMD_DP_GET_PREEMPHASIS_DRIVECURRENT_POSTCURSOR2_DATA"
params = "NV0073_CTRL_DP_GET_PREEMPHASIS_DRIVECURRENT_POSTCURSOR2_DATA_PARAMS"
label = "card"
open = "the pre-emphasis, drive-current, postcursor2 and TxPu table of the card's VBIOS (caraxes/reference/rtx2070/rom.bin, DP tables not parsed yet)"

[[control]]
name = "NV0073_CTRL_CMD_DP_GET_LEVEL_INFO_TABLE_DATA"
params = "NV0073_CTRL_DP_GET_LEVEL_INFO_TABLE_DATA_PARAMS"
label = "card"
open = "the per-link-rate DP drive table of the card's VBIOS (caraxes/reference/rtx2070/rom.bin, DP tables not parsed yet)"

# Open: the reserved and heap sizes are the device's own GSP regions (src/fb.rs layout),
# the heap free a constant and the owner table zeros (d-controls.tsv note; kernel twin 615
# src/nvidia/src/kernel/gpu/mem_mgr/mem_mgr_ctrl.c:920-957); the layout of the 4848-byte
# block and the region sizes still have to be tied to fb.rs.
[[control]]
name = "NV2080_CTRL_CMD_GSP_FB_STATS_GET"
params = "NV2080_CTRL_CMD_RM_FB_STATS_ENTRY"
label = "chip"
open = "the device's GSP heap regions of src/fb.rs (reserved, reserved heap, heap free) with a zero owner table"

# ---- The unanswered user-callable getters of the guest control sweep of 2026-09-25
# (caraxes/runs/coverage-2026-09-25/extra/work/ctlsweep-table-out.txt, provenance
# `unhandled`; docs/caraxes/coverage-map.md §3). None of the 21 is in the native traces
# (matrix/traces/610.57.04/control/*.tsv), and their physical implementations are GSP-RM
# code, not in the open tree. Seven are per-card truth without an address or handle and go
# to the host (`FORWARD`, src/ver/v610.rs). The fourteen below come from the chip files,
# the card's captures or the device's own policy, or are refused where the feature is
# absent. Header paths are the 615.71.09 tree's; the layouts are the same in 610.57.04
# (the `layout` column of caraxes/abi/gsp-6*/controls.tsv).

# A TSG's TPC partition mode (ctrl0080gr.h:203-245). Both setters are refused
# (src/ver/v610/public.rs REFUSED_TPC_PARTITION), so no TSG of the VM leaves mode NONE (0,
# ctrl0080gr.h:235). The handle is echoed, not checked.
[[control]]
name = "NV0080_CTRL_CMD_GR_GET_TPC_PARTITION_MODE"
params = "NV0080_CTRL_GR_TPC_PARTITION_MODE_PARAMS"
inputs = ["hChannelGroup", "grRouteInfo.flags", "grRouteInfo.route"]
label = "guest (TPC partition mode NONE: both SET_TPC_PARTITION_MODE controls are refused, public.rs REFUSED_TPC_PARTITION)"
fields = { mode = 0 }

# The compbit backing store (ctrl0080fb.h:103-168): the device has no compression (D16;
# FB_GET_CTAGS_FOR_CBC_EVICTION answers numCompTags 0). RM refuses the control to a vGPU
# guest as well (615 src/nvidia/src/kernel/rmapi/rmapi_utils.c:212).
[[control]]
name = "NV0080_CTRL_CMD_FB_GET_COMPBIT_STORE_INFO"
params = "NV0080_CTRL_FB_GET_COMPBIT_STORE_INFO_PARAMS"
status = "NOT_SUPPORTED"
label = "refused (no compression, D16: no compbit backing store)"

# TU106 has no NVJPG engine (chips/tu106/device-info.toml:21-31 lists GR, the CEs, NVDEC0-2,
# NVENC0 and SEC2).
[[control]]
name = "NV0080_CTRL_CMD_NVJPG_GET_CAPS_V2"
params = "NV0080_CTRL_NVJPG_GET_CAPS_V2_PARAMS"
status = "NOT_SUPPORTED"
label = "refused (no NVJPG on TU106: chips/tu106/device-info.toml has none)"

# The video protected region (ctrl2080gpu.h:2139-2164, 2250-2297) as physical FB addresses
# of the host. The VM has no VPR: FB_SETUP_VPR_REGION is refused (ctrl:D table), and RM
# refuses VPR_CAPS to a vGPU guest too (rmapi_utils.c:232).
[[control]]
name = "NV2080_CTRL_CMD_GPU_GET_VPR_CAPS"
params = "NV2080_CTRL_GPU_GET_VPR_CAPS_PARAMS"
status = "NOT_SUPPORTED"
label = "refused (no VPR in the VM: FB_SETUP_VPR_REGION is refused; the range is host FB addresses)"

[[control]]
name = "NV2080_CTRL_CMD_GPU_GET_VPR_INFO"
params = "NV2080_CTRL_GPU_GET_VPR_INFO_PARAMS"
status = "NOT_SUPPORTED"
label = "refused (no VPR in the VM: FB_SETUP_VPR_REGION is refused; the range is host FB addresses)"

# The InfoROM OEM object's bytes (ctrl2080gpu.h:2224-2248: "their own serial number, lot
# codes"). The card has the object (OEM Object 1.1, caraxes/reference/rtx2070/nvidia-smi-q.txt:49;
# GPU_GET_INFOROM_OBJECT_VERSION is forwarded), but its content is board identity, which
# stays device-owned (D6, src/nvml.rs:1-10): the object is present and empty.
[[control]]
name = "NV2080_CTRL_CMD_GPU_GET_OEM_INFO"
params = "NV2080_CTRL_GPU_GET_OEM_INFO_PARAMS"
label = "synthesized (OEM object present, content withheld: board identity is device-owned, D6; zeros)"

# Peer caps between GPUs (ctrl2080gpu.h:4044-4083) are a vGPU-guest control: RM answers
# NOT_SUPPORTED on bare metal (615 src/nvidia/src/kernel/platform/p2p/p2p_caps.c:973-975),
# and the kernel sends it only with the vGPU GSP plugin offload
# (src/nvidia/src/kernel/rmapi/client_resource.c:4315-4317). The VM has one GPU.
[[control]]
name = "NV2080_CTRL_CMD_GET_P2P_CAPS"
params = "NV2080_CTRL_GET_P2P_CAPS_PARAMS"
status = "NOT_SUPPORTED"
label = "refused (vGPU-guest control, NOT_SUPPORTED on bare metal: p2p_caps.c:973-975)"

# Compbit-copy constants (ctrl2080fb.h:1712-1772): no compression (D16).
[[control]]
name = "NV2080_CTRL_CMD_FB_GET_COMPBITCOPY_CONSTRUCT_INFO"
params = "NV2080_CTRL_CMD_FB_GET_COMPBITCOPY_CONSTRUCT_INFO_PARAMS"
status = "NOT_SUPPORTED"
label = "refused (no compression, D16: no compbit copy)"

# FB carveouts for the display FRM and UEFI (ctrl2080fb.h:2934-2955) are an integrated-GPU
# feature: the kernel asks for them only on GB10B
# (src/nvidia/src/kernel/gpu/mem_mgr/arch/blackwell/mem_mgr_gb10b_phys.c:417), and base and
# size are FB addresses.
[[control]]
name = "NV2080_CTRL_CMD_FB_GET_CARVEOUT_REGION_INFO"
params = "NV2080_CTRL_FB_GET_CARVEOUT_REGION_INFO_PARAMS"
status = "NOT_SUPPORTED"
label = "refused (FB carveouts are an integrated-GPU feature: the kernel asks only on GB10B)"

# WPR1 and WPR2 as FB offsets (ctrl2080fb.h:3069-3094): the host's secure regions;
# privileged, and no kernel caller in either tree.
[[control]]
name = "NV2080_CTRL_CMD_FB_GET_WPR_REGION_INFO"
params = "NV2080_CTRL_FB_GET_WPR_REGION_INFO_PARAMS"
status = "NOT_SUPPORTED"
label = "refused (host WPR offsets; privileged, no kernel caller)"

# RC mode and break (ctrl2080rc.h:339-385): the device's RC policy, as GET_RC_RECOVERY
# answers it (recovery on), and no debugger break on RC. SET_RC_INFO is refused (D table).
[[control]]
name = "NV2080_CTRL_CMD_GET_RC_INFO"
params = "NV2080_CTRL_CMD_RC_INFO_PARAMS"
label = "synthesized (the device's RC policy: rcMode ENABLE, rcBreak DISABLE, as GET_RC_RECOVERY)"
fields = { rcMode = 1, rcBreak = 0 }

# The PCEs behind each hub (ctrl2080ce.h:400-420). TU106 has no HSHUB (chip.toml
# [features] names `hshub` absent), so every PCE is on the FBHUB: 0xF, the union of the
# card's CE_GET_CE_PCE_MASK answers (COPY0 0x1, COPY2 0x4, COPY3 0x8, COPY4 0x2; native
# traces egl-gbm.tsv:714, 723, 729 and vk-offscreen.tsv:8380). Turing has one CE shim
# (chip.toml [ce] lce_shim): another shim is not answered.
[[control]]
name = "NV2080_CTRL_CMD_CE_GET_HUB_PCE_MASK_V2"
params = "NV2080_CTRL_CE_GET_HUB_PCE_MASK_V2_PARAMS"
inputs = ["shimInstance"]
label = "card (fbhubPceMask 0xF: the union of the card's CE_GET_CE_PCE_MASK answers; no HSHUB)"
[[control.case]]
when = { shimInstance = 0 }
fields = { fbhubPceMask = 0xF }

# Dielets (ctrl2080gpu.h:4975-5001) are a multi-die feature; GET_UNIT_FS_INFO_FROM_DIELET
# is refused the same way (public.rs).
[[control]]
name = "NV2080_CTRL_CMD_GPU_GET_DIELET_INFO"
params = "NV2080_CTRL_GPU_GET_DIELET_INFO_PARAMS"
status = "NOT_SUPPORTED"
label = "refused (no dielets on this chip)"

# The VBIOS I2C device table (ctrl402c.h:367-391): the device presents no I2C port
# (I2C_GET_PORT_INFO, ctrl.rs), so no device sits behind one.
[[control]]
name = "NV402C_CTRL_CMD_I2C_TABLE_GET_DEV_INFO"
params = "NV402C_CTRL_I2C_TABLE_GET_DEV_INFO_PARAMS"
label = "synthesized (no I2C devices: the device presents no I2C port, as I2C_GET_PORT_INFO)"
fields = { i2cDevCount = 0 }
