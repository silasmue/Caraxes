# src/nvidia/generated/g_allclasses.h. A GSP_RM_ALLOC of a class outside it is refused as
# GSP-RM refuses it: NV_ERR_NOT_SUPPORTED for a GPU-parented class (alloc_free.c:1393-1398),
# NV_ERR_INVALID_CLASS under a channel (channel_descendant.c:185-233)
