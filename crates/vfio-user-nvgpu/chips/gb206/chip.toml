# SPDX-License-Identifier: MIT
#
# GB206 (Blackwell, the chip of the RTX 5060 Ti). Tables for src/chip (decision D14,
# docs/caraxes/versatility.md, docs/caraxes/blackwell-gb206.md). Loaded by
# src/chip/gb206.rs; selected with `--chip gb206` or the board `rtx5060ti`.
#
# Sources: the lab capture caraxes/reference/gb206/ (RTX 5060 Ti, driver 615.71.09,
# 2026-09-24) for what the host RM reported, and vendor/open-gpu-kernel-modules at
# 610.57.04 (the guest driver) for everything else. Paths without a prefix are relative
# to vendor/open-gpu-kernel-modules/src. No value here identifies the captured card
# (blackwell-gb206.md 2.5): no UUID, PDI, serial, ECID or InfoROM data.
#
# Labels are the provenance labels the answers carry in the trace (decision D9);
# "synthesized" means chosen by the device, "unverified" means taken from a header
# whose use by the GB206 HAL has not been confirmed by a guest trace yet (the N gate,
# docs/caraxes/blackwell-gate.md, confirms or corrects it).

name = "gb206"
# rm-tools/lab-rm-query.txt:6 GPU_GET_SHORT_NAME_STRING short="GB206-A" (the host's GSP
# answer); the device uses the bare chip name as for TU106.
short_name = "GB206"

# rm-tools/lab-rm-query.txt:3 MC_GET_ARCH_INFO: architecture 0x1B0 (GB20x),
# implementation 0x6, revision 0xA1, chip_id 0x1B6; composed as for TU106
# (common/inc/swref/published/nv_ref.h:97-150): BOOT_0 = architecture 0x1B in 28:24,
# implementation 6 in 23:20, major A in 7:4, minor 1 in 3:0; BOOT_42 = chip id 0x1B6 in
# 29:20, major A in 19:16, minor 1 in 15:12. halmgrGetHalForGpu picks the GB206 HAL from
# BOOT_42 (nvidia/arch/nvalloc/unix/src/osapi.c:3726-3753; nvidia/src/kernel/gpu/gpu.c:4922).
# Composed, not read from the card (the capture reads no register).
[identity]
boot_0 = 0x1B60_00A1
boot_1 = 0x0000_0000
boot_42 = 0x1B6A_1000

[bar0]
# NV_EP_PCFGM 0x92000-0x92FFF (common/inc/swref/published/hopper/gh100/dev_xtl_ep_pri.h:26),
# the mirror gpuReadPassThruConfigReg_GH100 reads (nvidia/src/kernel/gpu/arch/hopper/
# kern_gpu_gh100.c:108), the GB206 HAL (nvidia/generated/g_gpu_nvoc.c:1322-1325). The bare-
# metal path gpuReadBusConfigReg_GH100 uses real config cycles (g_gpu_nvoc.c:1270-1273).
pcfg = 0x0009_2000
pcfg_size = 0x1000
# NV_PROM_DATA (turing/tu102/dev_ext_devices.h:27, the only definition in the tree). A
# GB20x guest does not read the ROM to boot (kgspExtractVbiosFromRom is a stub from GH100
# on, nvidia/generated/g_kernel_gsp_nvoc.c:1388-1402); the window serves the captured
# images for tools that do.
prom = 0x0030_0000
prom_size = 0x0010_0000

[registers]
# NV_XAL_EP_ZB_BAR0_WINDOW at 0xD40 of the XAL aperture (blackwell/gb202/dev_nv_xal_ep_zb.h:27),
# whose base is NV_XAL_BASE_ADDRESS 0x10F000 (hopper/gh100/hwproject.h:32, used by
# kbusConstructXalApertures_GH100, nvidia/src/kernel/gpu/bus/arch/hopper/kern_bus_gh100.c:3076;
# kbusGetXalAperture is the GH100 HAL for GB206, nvidia/generated/g_kern_bus_nvoc.c:2059-2062).
# BASE is 21:0 in 64 KiB units (hopper/gh100/dev_nv_xal_ep_zb.h:27-29); the window reaches
# vidmem only (kern_bus_gb202.c:162). The PRAMIN window behind it stays at 0x700000.
bar0_window = 0x0010_FD40
# NV_VIRTUAL_FUNCTION_PRIV_FUNC_BAR1_BLOCK_LOW_ADDR / BAR2_BLOCK_LOW_ADDR in the VF window
# at 0xB80000 (hopper/gh100/dev_vm.h:68, blackwell/gb100/dev_vm.h:60; the window base
# gpuGetVirtRegPhysOffset_TU102, nvidia/src/kernel/gpu/arch/turing/kern_gpu_tu102.c:94-101,
# the GB206 HAL, g_gpu_nvoc.c:1481-1489). Unverified: a GSP client may never write them.
bar1_block = 0x00B8_0F60
bar2_block = 0x00B8_0F70
pramin = 0x0070_0000
pramin_size = 0x0010_0000
# NV_VIRTUAL_FUNCTION_PRIV_MMU_INVALIDATE_PDB/_UPPER_PDB/_INVALIDATE (gb100/dev_vm.h:327-338),
# the same VF offsets as TU106.
mmu_invalidate_pdb = 0x00B8_30A0
mmu_invalidate_upper_pdb = 0x00B8_30A4
mmu_invalidate = 0x00B8_30B0
# NV_VIRTUAL_FUNCTION_PRIV_CPU_INTR_LEAF/TOP/TRIGGER (gb100/dev_vm.h:77-130): leaves at
# +0x1000, top at +0x1600, trigger at +0x1640, as on TU106.
intr_tree = 0x00B8_1000
intr_tree_size = 0x800
# NV_VIRTUAL_FUNCTION_PRIV_MMU_FAULT_BUFFER_GET(i)/_PUT(i) (gb100/dev_vm.h:162, 174).
fault_buffer_get = [0x00B8_3008, 0x00B8_3028]
fault_buffer_put = [0x00B8_300C, 0x00B8_302C]
# NV_VIRTUAL_FUNCTION_PRIV_ACCESS_COUNTER_NOTIFY_BUFFER_SIZE/_GET/_PUT/_INFO (gb100/dev_vm.h:503-539).
access_counter_notify_buffer_size = 0x00B8_3110
access_counter_get = 0x00B8_3114
access_counter_put = 0x00B8_3118
access_counter_info = 0x00B8_311C
# NV_VIRTUAL_FUNCTION_TIME_0/1 (gb100/dev_vm.h:616-618) and NV_VIRTUAL_FUNCTION_DOORBELL
# 0x30090 (blackwell/gb202/dev_vm.h:27) in the usermode window 0xB80000 + 0x30000
# (gpuGetRegBaseOffset_GB100, nvidia/src/kernel/gpu/arch/blackwell/kern_gpu_gb100.c:1804-1822).
usermode_time_0 = 0x00BB_0080
usermode_time_1 = 0x00BB_0084
usermode_doorbell = 0x00BB_0090
# L2 cache operations. From GH100 on they are token registers in the XAL aperture: the CPU
# reads NV_XAL_EP_ZB_UFLUSH_L2_FLUSH_DIRTY to start one and polls _COMPLETED until its
# token is reached and STATUS is idle (nvidia/src/kernel/gpu/mem_sys/arch/hopper/
# kern_mem_sys_gh100.c:62-110; hopper/gh100/dev_nv_xal_ep_zb.h:30-49, base 0x10F000).
# The generic model answers these offsets with 0 (token 0, idle), which ends the poll at
# once; the VF sysmem/peer invalidates are at +0xF10/+0xF18 (gb100/dev_vm.h:42, 51).
# Unverified for GB206 (kmemsysDoCacheOp HAL): the N gate trace settles it.
l2_flush_dirty = 0x0010_F810
l2_sysmem_invalidate = [0x00B8_0F10, 0x00B8_0F14]
l2_ops_local = [0x0010_F800, 0x0010_F804, 0x0010_F808, 0x0010_F80C]

# engineCaps: the NV2080_ENGINE_TYPE list of the host's GET_ENGINES_V2
# (caraxes/reference/gb206/rm-tools/fifo-host-query.txt:4). TU106 also lists HOST
# (0x27); the GB206 host list does not.
[engine_caps]
types = ["GR0", "COPY0", "COPY4", "COPY7", "NVDEC0", "NVENC0", "SW", "SEC2", "NVJPEG0", "OFA0"]
summary = "GR0, CE0/4/7, NVDEC0, NVENC0, SW, SEC2, NVJPG0, OFA0"
source = "host (GB206 GET_ENGINES_V2, caraxes/reference/gb206/rm-tools/fifo-host-query.txt:4)"

# INTERNAL_GPU_GET_CHIP_INFO regBases per gpuGetRegBaseOffset_GB100
# (kern_gpu_gb100.c:1804-1822): TIMER = NV_PTIMER0_PRI_BASE 0x9000
# (blackwell/gb100/hwproject.h:38), USERMODE = the VF window 0xB80000 + DRF_BASE(NV_VIRTUAL_FUNCTION)
# 0x30000 (gb100/dev_vm.h:31, 39). 615.71.09 removes this control (its id is reused,
# blackwell-gb206.md 3.4); only a 610 guest asks for it.
[chip_info]
timer_base = 0x9000
usermode_base = 0x00BB_0000
label = "card (config space) + synthesized regBases (kern_gpu_gb100.c:1804-1822)"

[user_register_access_map]
value = 0x8_0000
label = "synthesized (allow-all map, gpu_register_access_map.c:260-298; unchanged from TU106, recheck the GB20x size)"

# INTERNAL_MEMSYS_GET_STATIC_CONFIG. The capture has no L2 or LTC facts (a second capture
# with FB_GET_INFO_V2 L2_CACHE_SIZE/LTC_COUNT/LTS_COUNT gives them, blackwell-gb206.md 2.3);
# until then the values are synthesized. GDDR7 = 0x15 (sdk/ctrl/ctrl2080/ctrl2080fb.h:423) is
# the product's memory, not a capture value.
[memsys]
disable_compbit_backing = true
l2_cache_size = 0x200_0000
fbpa_present = true
compr_page_size = 0x1_0000
compr_page_shift = 16
ram_type = "GDDR7"
ltc_count = 8
lts_per_ltc_count = 2
label = "synthesized (GB206: 32 MiB L2, 8 LTC x 2 LTS, unverified; GDDR7 from the product)"

# FIFO_GET_INFO on the host (rm-tools/fifo-host-query.txt:22): 16384 channel groups, 128
# channels per group. The per-runlist count of INTERNAL_FIFO_GET_NUM_CHANNELS and the fault
# method buffer (refused on the host with 0x1B, :39) are synthesized like TU106.
[fifo]
num_channels = { value = 512, label = "synthesized (512 channels per runlist, as TU106)" }
fault_method_buffer_size = { value = 0x8000, label = "synthesized (32 KiB fault method buffer, as TU106)" }

# Hopper and later use the 5-level, 57-bit GMMU format (versatility.md, "GMMU format"),
# walked by src/gmmu_v3.rs (kgmmuFmtInitLevels_GB10X; hopper/gh100/dev_mmu.h fields) for
# the BAR1/BAR2 apertures and the leaf enumeration; fb.rs selects it through
# `with_mmu_format` (boot.rs). The incremental shadow walker (ptcache.rs) stays v2: it
# serves host execution only, which a Blackwell identity does not have. The host reports 52-bit DMA
# (gpu-0000_01_00.0/proc-information.txt:8-9).
[gmmu]
mmu_format = "gmmu-v3-57bit"
fault_buffer_entries = 256
fault_entry_size = 32
label = "synthesized (256-entry fault buffers, as TU106)"

# kceSetDecompCeCap is the no-op d44104 for GB206; only GB100/GB102/GB10B/GB110/GB112
# get the GB100 decompression CE (nvidia/generated/g_kernel_ce_nvoc.c:375-385).
[ce]
decomp_lce = false
decomp_label = "synthesized (no decompression LCE on GB206, g_kernel_ce_nvoc.c:375-385)"

[gr]
per_subctx_header = { value = true, label = "synthesized (bPerSubcontextContextHeaderSupported TRUE for GB206, g_kernel_graphics_nvoc.c:306-311)" }
# GeForce: no MIG (gpu-0000_01_00.0/nvidia-smi-q.txt:22-24, MIG Mode N/A).
mig = false
smc_label = "host (MIG N/A on the GB206 GeForce, caraxes/reference/gb206/gpu-0000_01_00.0/nvidia-smi-q.txt:22-24)"

# Channel classes the card exposes (rm-tools/lab-rm-query.txt): BLACKWELL_CHANNEL_GPFIFO_B
# 0xCA6F (:110), BLACKWELL_DMA_COPY_B 0xCAB5 (:118), GP100_UVM_SW 0xC076 (:88),
# BLACKWELL_COMPUTE_B 0xCEC0 (:125). channel.rs decodes the C46F/C5B5 method subsets; the
# Blackwell classes need theirs checked before work submission (past the N gate).
[channel]
gpfifo = 0xCA6F
copy = 0xCAB5
uvm_sw = 0xC076
compute = 0xCEC0

# The feature families of category E (chips/tu106/chip.toml, src/chipctl.rs). The GB206
# GeForce has no NVLink, fabric, C2C or MIG and is no vGPU host
# (caraxes/reference/gb206/gpu-0000_01_00.0/nvidia-smi-q.txt:22-24 "MIG Mode N/A",
# :62-63 "Virtualization Mode None", :274 "Global Fabric Manager State N/A"), and the
# device presents it without Confidential Computing, SPDM, CCU or a G-SYNC board. HSHUB is
# absent with NVLink and C2C; revisit if a GB206 capture answers an HSHUB control.
#
# The category D families (chips/tu106/chip.toml, src/ver/v<major>/dmodel.rs): GB206 has
# what Blackwell brings. Present: HDMI FRL and DP 2.x (the GB20x display), the later
# display features (NVC370 SET_SOR_FLUSH_MODE is "NV Display 5.0+ (GB20X+ and T264+)", 615
# ctrl/ctrlc370/ctrlc370or.h:36-73; shared generic packets from the C8 HAL on), the
# Ampere-and-later features, row remapping (caraxes/reference/gb206/gpu-0000_01_00.0/
# nvidia-smi-q.txt:181-183, "Remapped Rows" with counters) and the Blackwell features (DRAM
# encryption is reported, :148-150 "Disabled", GSP-lite CMC, HES on GB20x per 615
# src/nvidia/generated/g_kern_hwpm_nvoc.c:244-253, MMU GCC debug). Absent: ECC (:151-153
# "ECC Mode N/A"), the GA100-GA107 relaxed-ordering HAL, the Hopper/Grace platform (C2C,
# Confidential Computing), MIG, NVLink and SLI, notebook power (a desktop board), embedded
# display, vGPU-only paths, Windows-only paths and the uncalled legacy controls.
[features]
absent = ["rm_test", "nvlink", "hshub", "fabric", "c2c", "gsync", "vgpu", "mig", "cc", "spdm", "ccu", "internal_uncalled",
    "display_embedded", "notebook_power", "ecc", "mig_partitioning", "nvlink_sli", "ga10x_pcie_ro", "hopper_platform",
    "vgpu_paths", "windows_only", "legacy_uncalled"]
present = ["frl", "dp2x", "display_later", "ampere_later", "row_remap", "blackwell"]
