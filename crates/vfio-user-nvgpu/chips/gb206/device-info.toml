# DRAFT from the lab capture caraxes/reference/gb206/rm-tools/fifo-host-query.txt
# (RTX 5060 Ti, driver 615.71.09; docs/caraxes/blackwell-gb206.md). Same format as
# chips/tu106/device-info.toml; not loaded by any code.
#
# Host columns (from the capture): the engine list (GET_ENGINES_V2, :4), the MMU fault
# ids (GET_ENGINE_FAULT_INFO, :5-14), the runqueue partner of GR0 (COPY0 in rq0,
# :5-6: GR0 and CE0 form the GRCE pair), and the PCE masks (:6-8).
# Synthesized columns (runlist, PBDMA ids, PBDMA fault ids) follow the TU106 rule of
# docs/caraxes/fifo-device-info.md and are NOT checked against the GB20x kernel
# constraints yet (kfifo GB202 HALs, src/kernel/gpu/fifo/arch/blackwell/kernel_fifo_gb202.c).
# The host's own FIFO_GET_DEVICE_INFO_TABLE was refused (status 0x1F, :38): its
# parameter struct grew from 3212 to 3340 bytes in 615.71.09 (rm-tools/abi-check-home.txt:7-8),
# so the real table was not seen. A second capture with a 615 build of the tool would
# give runlists and PBDMAs directly.
#
# Names not in src/ver/v610.rs yet: RM engine types COPY7 (0x10), NVJPEG0 (0x36),
# OFA0 (0x3E) (src/nvidia/inc/kernel/gpu/gpu_engine_type.h); MC indices CE7 (22),
# NVJPEG0 (= MC_ENGINE_IDX_NVJPG), OFA0 (81) (src/nvidia/inc/kernel/gpu/intr/engine_idx.h:61,92-93,125);
# ENG_DESC classes OBJNVJPG 0x2B3A54 and OBJOFA 0xDD7BAB (generated/g_eng_desc_nvoc.h:825,865).
#
# dev_type 19 = LCE as on TU106 (OPEN: check the GB20x device-info type numbering).

