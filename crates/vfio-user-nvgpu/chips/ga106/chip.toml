#
# Costume ladder rung 2 (docs/caraxes/costume-ladder.md): GA106, the RTX 3060's chip
# (Ampere), presented over the TU106 of the house. An overlay on chips/tu106
# (src/chip/derived.rs). Paths are relative to vendor/open-gpu-kernel-modules at 610.57.04.
# No GA106 was ever read in this project: every value below comes from the open tree's
# headers and generated tables, as each comment says; nothing is invented except where a
# comment says "invented".
#
# The costume: the boot identity (which makes the guest pick the GA102-family HAL,
# halmgrGetHalForGpu from PMC_BOOT_42), the short name, the class database and the channel
# classes the guest allocates. The truth, kept from chips/tu106: the BAR0 register map, the
# FIFO device-info table (the TU106 engines and runlists that execute), the interrupt table,
# engine caps, memsys (4 MiB L2, GDDR6), GMMU v2 (Ampere GA10x uses the same
# GMMU_FMT_VERSION_2 format, kern_gmmu_ga100.c), the feature families (the Ampere-only
# families stay absent: the silicon has none of them), the GR facts and the Turing boot
# model with the overlay of boot.toml.
base = "tu106"
name = "ga106"
short_name = "GA106"

# NV_PMC_BOOT_0/BOOT_42 of GA106 revision A1: architecture 0x17 (GA100 family,
# NV2080_CTRL_MC_ARCH_INFO_ARCHITECTURE_GA100 0x170, ctrl2080mc.h:77) and implementation 6
# (_IMPLEMENTATION_GA106, ctrl2080mc.h:115), encoded as chips/tu106 encodes TU106. The
# revision A1 is invented (TU106's).
[identity]
boot_0 = 0x1760_00A1
boot_1 = 0x0000_0000
boot_42 = 0x176A_1000

# The classes the guest allocates on its channels: AMPERE_CHANNEL_GPFIFO_A (clc56f.h),
# AMPERE_DMA_COPY_B (clc7b5.h), GP100_UVM_SW, AMPERE_COMPUTE_B (clc7c0.h), the GA10x list
# below (g_gpu_class_list.c:1133-1199). The mirror allocates the TU106 class of the same
# role on the host (boards/rtx3060-on-tu106.toml `class_map`).
[channel]
gpfifo = 0xC56F
copy = 0xC7B5
uvm_sw = 0xC076
compute = 0xC7C0

[classes]
source = "g_gpu_class_list.c:32-54, 1080-1130, 1133-1199 of 610.57.04 (generic, GA106 no-engine and engine lists)"
