# A data-center Hopper has MIG (the SMC partitioning of the GR engine).
[gr]
mig = true
smc_label = "costume (GH100 has MIG; the executing TU106 has none)"

# The families GH100 has (the operator's list for this rung): NVLink, HSHUB, the NVLink
# fabric, C2C, MIG and Confidential Computing are present; their controls then reach the
# other handlers and end unanswered, and the run shows which of them the guest insists on
# at boot. The rest as chips/gb206 (a desktop Blackwell) minus the display families (a
# GH100 has no display) and the Blackwell-only family; the Hopper platform family present.
[features]
absent = ["rm_test", "gsync", "vgpu", "spdm", "ccu", "internal_uncalled",
    "frl", "dp2x", "display_later", "display_embedded", "notebook_power", "ecc", "row_remap",
    "mig_partitioning", "nvlink_sli", "ga10x_pcie_ro", "blackwell", "vgpu_paths", "windows_only",
    "legacy_uncalled"]
present = ["nvlink", "hshub", "fabric", "c2c", "mig", "cc", "ampere_later", "hopper_platform"]
