#
# Costume ladder rung 4 (docs/caraxes/costume-ladder.md): GH100, the H100's chip
# (Hopper), presented over the TU106 of the house. An overlay on chips/gb206
# (src/chip/derived.rs): the FSP boot model of the Blackwell package (src/chip/boot_fsp.rs),
# GMMU v3 and the GB206 register map, device-info and interrupt tables stay GB206's; the
# overlay changes the identity, the class database, the channel classes, the feature
# families and MIG. Paths are relative to vendor/open-gpu-kernel-modules at 610.57.04; no
# GH100 was ever read, every value comes from the open tree, and the GB206 tables under it
# are the lab capture's (docs/caraxes/blackwell-gb206.md).
base = "gb206"
name = "gh100"
short_name = "GH100"

# NV_PMC_BOOT_0/BOOT_42 of GH100 revision A1: architecture 0x18 (GH100,
# NV2080_CTRL_MC_ARCH_INFO_ARCHITECTURE_GH100 0x180, ctrl2080mc.h:78) and implementation 0
# (_IMPLEMENTATION_GH100, ctrl2080mc.h:121). The revision A1 is invented.
[identity]
boot_0 = 0x1800_00A1
boot_1 = 0x0000_0000
boot_42 = 0x180A_1000

# HOPPER_CHANNEL_GPFIFO_A (clc86f.h), HOPPER_DMA_COPY_A (clc8b5.h), GP100_UVM_SW,
# HOPPER_COMPUTE_A (clcbc0.h) (g_gpu_class_list.c:2030-2112).
[channel]
gpfifo = 0xC86F
copy = 0xC8B5
uvm_sw = 0xC076
compute = 0xCBC0

[classes]
source = "g_gpu_class_list.c:32-54, 1974-2027, 2030-2112 of 610.57.04 (generic, GH100 no-engine and engine lists)"
