#
# The GA100 rung of the limits runs (docs/caraxes/limits-mig-ecc-vgpu.md): GA100, the A100's
# chip (Ampere, data center), presented over the TU106 of the house. An overlay on
# chips/tu106 (src/chip/derived.rs). Paths are relative to vendor/open-gpu-kernel-modules;
# "615" is 615.71.09, "610" is 610.57.04 (the guest's version, whose class list the guest
# builds its class database from). No GA100 was ever read: every value comes from the open
# tree, as each comment says; "invented" where nothing in the tree gives it.
#
# Why the Turing base fits: GA100 boots GSP-RM with the TU10x image (gsp_tu10x.bin,
# NV_FIRMWARE_CHIP_FAMILY_GA100 falls through to TU10X, kernel-open/common/inc/
# nv-firmware.h:118-125 of 615), reads the usable FB size the TU102 way
# (kmemsysReadUsableFbSize_GP102 for TU10x and GA100, g_kern_mem_sys_nvoc.c:363-367 of 615)
# and shares the TU102 GSP boot HALs except the debug-fuse and ucode-fuse reads
# (kernel_gsp_ga100.c:38-80 of 615), which chips/tu106/boot.toml already answers. So no
# boot.toml overlay: the GA102-family overlays of chips/ga106 do not apply.
#
# The costume: identity, short name, classes, channel classes, the feature families of a
# data-center Ampere (ECC, the row remapper, MIG), the GR facts MIG slices by, [ecc] and
# [mig]. The truth underneath: the TU106 register map, device info (one GR engine, so one
# GPU instance at a time), interrupts, memsys and the Turing boot model.
base = "tu106"
name = "ga100"
short_name = "GA100"

# NV_PMC_BOOT_0/BOOT_42 of GA100 revision A1: architecture 0x17 (GA100 family,
# NV2080_CTRL_MC_ARCH_INFO_ARCHITECTURE_GA100 0x170, ctrl2080mc.h:78 of 615) and
# implementation 0 (_IMPLEMENTATION_GA100, ctrl2080mc.h:109 of 615), encoded as chips/tu106
# encodes TU106. The revision A1 is invented (TU106's).
[identity]
boot_0 = 0x1700_00A1
boot_1 = 0x0000_0000
boot_42 = 0x170A_1000

# AMPERE_CHANNEL_GPFIFO_A (clc56f.h), AMPERE_DMA_COPY_A (clc6b5.h), GP100_UVM_SW,
# AMPERE_COMPUTE_A (clc6c0.h) (g_gpu_class_list.c:642-711 of 610, GA100 engine list).
[channel]
gpfifo = 0xC56F
copy = 0xC6B5
uvm_sw = 0xC076
compute = 0xC6C0

[classes]
source = "g_gpu_class_list.c:32-54, 590-639, 642-711 of 610.57.04 (generic, GA100 no-engine and engine lists; the 615 lists are at :630-759)"
