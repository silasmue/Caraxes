# INTERNAL_GPU_GET_SMC_MODE and the MIG static tables (families/mig.rs). The GR facts of
# pure emulation (kgr.rs), GA100's instead of TU106's: the MIG code slices by them.
# LITTER_NUM_GPCS 0x14 = 8, LITTER_NUM_TPC_PER_GPC 0x17 = 8, SM_PER_TPC 0x20 = 2: the full
# GA100 of the Ampere whitepaper (8 GPCs, 128 SMs; the A100 enables 108 in 7 GPCs; the open
# tree has no GA100 constant). SM_VERSION 0x0C = 0x0800 (compute capability 8.0; the header
# names no 8.0 constant, ctrl2080gr.h:312-318 of 615: invented in its encoding).
# MAX_MIG_ENGINES 0x35 = 8 (KGRMGR_MAX_GR), MAX_PARTITIONABLE_GPCS 0x36 = 8 (the span the
# swizzIds cut, kmigmgrSwizzIdToSpan_GA100, kmigmgr_ga100.c:392 of 615),
# LITTER_MIN_SUBCTX_PER_SMC_ENG 0x37 = 8 (invented, 64 subcontexts / 8), MAX_SUBCONTEXT 0x2C
# = 64 (TU106's capture).
[gr]
mig = true
smc_label = "costume (GA100 has MIG; the executing TU106 has none)"
emulated_info = { entries = [[0x2C, 64], [0x14, 8], [0x17, 8], [0x20, 2], [0x0C, 0x0800], [0x35, 8], [0x36, 8], [0x37, 8]], label = "costume (GA100 design constants, Ampere whitepaper; MIG span of the kernel's rules) + synthesized (rest 0)" }

# The families of a data-center Ampere: TU106's list with ECC, the row remapper, MIG and
# the MIG partitioning internals present (each with its model, src/families), and
# ampere_later (the Ampere-and-later controls). NVLink stays absent: the A100 PCIe's bridge
# is not modelled. The display families stay as TU106 has them (GA100 constructs no display
# engine; its class list has none).
[features]
absent = ["rm_test", "nvlink", "hshub", "fabric", "c2c", "gsync", "vgpu", "cc", "spdm", "ccu",
    "internal_uncalled", "frl", "dp2x", "display_later", "display_embedded", "notebook_power",
    "nvlink_sli", "ga10x_pcie_ro", "hopper_platform", "blackwell", "vgpu_paths", "windows_only",
    "legacy_uncalled"]
present = ["ecc", "row_remap", "mig", "mig_partitioning", "ampere_later"]

# ECC of the A100's HBM2 (src/families/ecc.rs): on by default. Units: NV2080_CTRL_GPU_ECC_UNIT_GSP
# 0x1D, the one unit the open headers name (ctrl2080gpu.h:1123-1126 of 615); which of the
# other indices an A100 marks supported is GSP-RM's. The remapper's bank count and the
# InfoROM ECC object's version are a capture's (invented: 0 and 1.0, as chips/gh100).
[ecc]
units = [0x1D]
default_enabled = true
remap_banks = 0
inforom_ecc_object = [1, 0]
label = "costume (A100 HBM2 ECC on; units: the open headers' GSP unit only; no capture)"

# MIG (src/families/mig.rs). No resetless MIG on GA100 (PDB_PROP_GPU_RESETLESS_MIG_SUPPORTED
# is TRUE from GH100 on, g_gpu_nvoc.c:403-413 of 615): `-mig 1` stays pending until a GPU
# reset or a power-on, and the kernel learns at load that MIG is on from the devinit bit
# NV_PBUS_SW_SCRATCH(1) 0x1404 SMC_MODE 15:15 (ampere/ga100/dev_bus.h:27,
# dev_bus_addendum.h:27-29; kmigmgrIsDevinitMIGBitSet_GA100, kmigmgr_ga100.c:42-53 of 615).
# Profiles: the A100 40GB's shapes on the pairs GA100 accepts (kmigmgrIsGPUInstanceCombinationValid_GA100,
# kmigmgr_ga100.c:226-297 of 615), scaled to the rung: seven usable GPCs in an eight-slot span,
# memory by the kernel's own swizzId split of the partitionable range
# (kmemsysSwizzIdToVmmuSegmentsRange_GA100, kern_mem_sys_ga100.c:254-316 of 615; no swizzId
# is rejected by HW before GH100), the engines of the rung that an A100 has (one GR, the
# three async copy engines, three NVDECs; an A100 has no NVENC, and the TU106 has no NVJPG
# or OFA, so 1g.5gb+me is left out). VMMU segment 32 MiB (ctrl2080gpu.h:3144 of 615; an
# A100's is a capture's). VEIDs 8 and SMs 16 per GPC as chips/gh100 (invented).
[mig]
resetless = false
devinit_scratch = [0x1404, 15]
vmmu_segment_mib = 32
gpcs = 7
span_len = 8
tpcs_per_gpc = 8
sms_per_gpc = 16
veids_per_gpc = 8
rejected_swizz = []
engines = ["GR0", "COPY2", "COPY3", "COPY4", "NVDEC0", "NVDEC1", "NVDEC2"]
label = "costume (A100 MIG shapes on the kernel's rules, scaled to the rung; no capture)"
profile = [
    { name = "7g", flag = 0x00, gpcs = 7, ce = 3, nvdec = 3, nvenc = 0, nvjpg = 0, ofa = 0 },
    { name = "4g", flag = 0x05, gpcs = 4, ce = 2, nvdec = 2, nvenc = 0, nvjpg = 0, ofa = 0 },
    { name = "3g", flag = 0x09, gpcs = 3, ce = 2, nvdec = 2, nvenc = 0, nvjpg = 0, ofa = 0 },
    { name = "2g", flag = 0x0E, gpcs = 2, ce = 1, nvdec = 1, nvenc = 0, nvjpg = 0, ofa = 0 },
    { name = "1g", flag = 0x17, gpcs = 1, ce = 1, nvdec = 0, nvenc = 0, nvjpg = 0, ofa = 0 },
]
