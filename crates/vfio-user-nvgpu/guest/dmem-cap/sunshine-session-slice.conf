# Sunshine is streaming infrastructure like the compositor: its capture and NVENC buffers must
# not fail when a game fills the application cap of caraxes-dmem-cap, so it runs in
# session.slice, outside the cap (systemd.resource-control(5) Slice=). Installed as
# /etc/systemd/user/app-dev.lizardbyte.app.Sunshine.service.d/caraxes-session-slice.conf.
[Service]
Slice=session.slice
