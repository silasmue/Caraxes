# /etc/caraxes/dmem-cap.conf: settings of caraxes-dmem-cap (KEY=value, the last line wins).
# After a change: systemctl --user reload caraxes-dmem-cap (as the desktop user).

# Display reserve per GPU: -1 = automatic, 5 scanout buffers of the largest mode of each
# connected display, each rounded up to 2 MiB, + 2 MiB for cursors (52 MiB at 1920x1080,
# 82 at 2560x1440, 162 at 3840x2160); 0 = no cap at all; N = N MiB.
DISPLAY_RESERVE_MIB=-1

# Added to the display reserve: what session.slice (compositor, Xwayland, a stream server)
# allocates after the cap is set, for example a stream's encoder buffers. 0 without one.
SESSION_RESERVE_MIB=32

# The capped slice below user@UID.service.
APP_SLICE=app.slice
