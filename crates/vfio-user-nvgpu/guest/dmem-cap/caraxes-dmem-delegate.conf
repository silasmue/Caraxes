# The delegator's half of the dmem display reserve (caraxes-dmem-cap): before the user
# manager starts, enable dmem in cgroup.subtree_control from the root down to user-%i.slice,
# so that user@%i.service lists dmem in cgroup.controllers and can distribute it
# (cgroup-v2.rst "Top-down Constraint", "Model of Delegation"). This is the step systemd's
# Delegate= does for the controllers it supports; systemd has no dmem support yet (PR #37079).
# Once it has, Delegate= with dmem replaces this drop-in. "+": runs as root; "-": a failure
# never keeps the user manager from starting. Installed as
# /etc/systemd/system/user@.service.d/caraxes-dmem.conf by install.sh.
[Service]
ExecStartPre=-+/usr/local/libexec/caraxes/caraxes-dmem-cap delegate %i
