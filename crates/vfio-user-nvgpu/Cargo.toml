[package]
name = "vfio-user-nvgpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Caraxes: a synthetic NVIDIA PCI device served over vfio-user for stock guest drivers"

[lib]
name = "vfio_user_nvgpu"
path = "src/lib.rs"

[[bin]]
name = "vfio-user-nvgpu"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
libc.workspace = true
# Both versions' layouts in every build: the host driver is chosen at run time from the
# running driver (src/hostabi.rs, docs/caraxes/cutover-615.md), the guest ABI from what the
# guest sends (src/ver, docs/research/one-abi-binary-2026-09-28.md).
nvrm-sys = { workspace = true, features = ["v610", "v615"] }
nvrm-abi.workspace = true
nvrm-client = { path = "../nvrm-client" }
# The DisplayPort sink behind the emulated connector (docs/caraxes/display-ab.md).
dp-sink = { path = "../dp-sink" }
log = "0.4"
env_logger = "0.11"
# Same rust-vmm lineage as the vfio-user client in the pinned Cloud Hypervisor
# (vfio_user 0.1.3); the git-ignored vendor/vfio checkout is for reading.
vfio_user = "0.1.6"
vfio-bindings = { version = "0.6", features = ["fam-wrappers"] }
# The per-chip and per-board data files (chips/<chip>/*.toml, boards/*.toml).
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# The GSP driver-version axis (decision D14, docs/caraxes/versatility.md): `src/ver` holds
# one module per guest driver version, and every build carries all of them; the device
# serves the guest ABI the guest shows at its GSP boot (570 nova-core, 610, 615 Linux and
# the 617 Windows guest on the 615 model), or the one `--guest-abi`/`CARAXES_GUEST_ABI`
# pins (docs/research/one-abi-binary-2026-09-28.md). The two features are no-ops kept so
# that older scripts' `--features v615` still build the one binary.
[features]
default = ["v610"]
v610 = []
v615 = []
