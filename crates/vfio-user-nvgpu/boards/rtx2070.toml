#
# The board axis (decision D14, docs/caraxes/versatility.md): what the RTX 2070 board
# adds to its chip. PCI ids, subsystem ids, class, revision and the capability chain
# come from the config-space capture named here, the ROM from its ROM capture; this
# file holds what neither capture carries. Everything can be overridden on the
# command line (--chip, --config, --rom, --board, --vbios-version).

# The personality in the guest name "Leandro VFIO <name>-<size>" (identity-profile.md;
# generated by nvrm_abi::naming, "Leandro <name>-<size>" with --name-format legacy).
name = "RTX 2070"
# The chip on the board (src/chip, chips/<chip>/).
chip = "tu106"
# Captures of the physical card (caraxes/reference/rtx2070/, relative to LEA_ROOT).
config = "caraxes/reference/rtx2070/config-space.txt"
rom = "caraxes/reference/rtx2070/rom.bin"
# VBIOS 90.06.3D.00.76 from the card's BIT (the version the kernel prints from the
# synthetic image, docs/caraxes/vbios-synthesis.md): vbiosRevision 0x90063D00 and
# vbiosOemRevision 0x76 in the static info and BIOS_GET_INFO_V2.
vbios_version = "90.06.3D.00.76"

# The BARs in the order the card exposes them (docs/caraxes/environment.md): 16 MiB
# registers, 256 MiB framebuffer window, 32 MiB RAMIN window, 128 B I/O. "mem64"
# occupies two BAR registers.
bars = [
    { kind = "mem32", size = 0x100_0000, prefetch = false },
    { kind = "mem64", size = 0x1000_0000, prefetch = true },
    { kind = "mem64", size = 0x200_0000, prefetch = true },
    { kind = "io", size = 0x80 },
]
# Expansion ROM BAR size (the card decodes 512 KiB).
rom_bar_size = 0x8_0000

# The card's SKU strings for the 615 static configuration (NVGMC_SC_CHIP_SKU and
# _CHIP_SKU_MODIFIER, docs/caraxes/gsp-plan/boot-exchange.md §3.1), from the card's
# "GPU Part Number 1F02-400-A1" (caraxes/reference/rtx2070/nvidia-smi-q.txt:37): the
# PCI device id, then chipSKU, then chipSKUMod (the split is inferred from the three
# fields of NV2080_CTRL_BIOS_GET_SKU_INFO the kernel fills from the static
# configuration, subdevice_ctrl_gpu_kernel.c:3859 of 615.71.09).
[sku]
chip_sku = "400"
chip_sku_modifier = "A1"
source = "caraxes/reference/rtx2070/nvidia-smi-q.txt:37, GPU Part Number 1F02-400-A1"

# The board's display outputs (decision D15: DisplayPort SST, one connector per head;
# docs/caraxes/display-ab.md). Synthetic: the physical card has DP, HDMI and USB-C
# outputs, none of which is reproduced. display_id is the NV0073 display id (one bit),
# sor the output resource that drives it, index the connector's physical index.
[display]
label = "board (rtx2070: one DisplayPort SST connector on SOR0)"
connector = [
    { display_id = 0x100, sor = 0, index = 0, kind = "DP" },
]
