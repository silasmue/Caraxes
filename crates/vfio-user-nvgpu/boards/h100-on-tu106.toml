#
# Costume ladder rung 4 (docs/caraxes/costume-ladder.md): an H100 PCIe (GH100, Hopper)
# over the TU106 of the house. Costume: the chip (chips/gh100, an overlay on the GB206 data
# set: the FSP boot model and GMMU v3 with the Hopper identity, classes and feature
# families), the PCI device id 10de:2331 with subsystem 10de:1626 ("NVIDIA H100 PCIe",
# g_nv_name_released.h:598 of 610.57.04) and the personality. The config layout, ROM and
# BARs are the GB206 capture's (the FSP boot parses no VBIOS image; a data-center card has
# no display, so no [display]). Truth: the TU106 executes (host_chip).
name = "H100 PCIe"
chip = "gh100"
host_chip = "tu106"
config = "caraxes/reference/gb206/gpu-0000_01_00.0/config-space.txt"
rom = "caraxes/reference/gb206/gpu-0000_01_00.0/rom.bin"
vbios_version = "98.06.1F.40.4A"
msix = false

bars = [
    { kind = "mem32", size = 0x400_0000, prefetch = false },
    { kind = "mem64", size = 0x1000_0000, prefetch = true },
    { kind = "mem64", size = 0x200_0000, prefetch = true },
    { kind = "io", size = 0x80 },
]
rom_bar_size = 0x8_0000

# [guest, host]: HOPPER_CHANNEL_GPFIFO_A -> TURING_CHANNEL_GPFIFO_A, HOPPER_COMPUTE_A ->
# TURING_COMPUTE_A, HOPPER_DMA_COPY_A -> TURING_DMA_COPY_A, HOPPER_A -> TURING_A,
# HOPPER_USERMODE_A -> TURING_USERMODE_A (g_allclasses.h of 610.57.04).
class_map = [
    [0xC86F, 0xC46F],
    [0xCBC0, 0xC5C0],
    [0xC8B5, 0xC5B5],
    [0xCB97, 0xC597],
    [0xC661, 0xC461],
]

[ids]
device = 0x2331
sub_vendor = 0x10DE
sub_device = 0x1626
source = "g_nv_name_released.h:598 of 610.57.04 (H100 PCIe); no capture"
