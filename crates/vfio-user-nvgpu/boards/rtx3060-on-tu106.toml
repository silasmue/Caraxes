#
# Costume ladder rung 2 (docs/caraxes/costume-ladder.md): an RTX 3060 (GA106, Ampere)
# over the TU106 of the house. Costume: the chip (chips/ga106: PMC_BOOT_0/42, the Ampere
# class database and channel classes), the PCI device id 10de:2503 ("NVIDIA GeForce RTX
# 3060", g_nv_name_released.h:641 of 610.57.04) and the personality. Truth: the RTX 2070
# board's config layout, subsystem, ROM, VBIOS and BARs, and the TU106 that executes.
# `class_map`: the host objects of a guest channel are allocated with the TU106 class of
# the same role (the guest keeps its Ampere class in every answer it reads).
name = "RTX 3060"
chip = "ga106"
host_chip = "tu106"
config = "caraxes/reference/rtx2070/config-space.txt"
rom = "caraxes/reference/rtx2070/rom.bin"
vbios_version = "90.06.3D.00.76"

bars = [
    { kind = "mem32", size = 0x100_0000, prefetch = false },
    { kind = "mem64", size = 0x1000_0000, prefetch = true },
    { kind = "mem64", size = 0x200_0000, prefetch = true },
    { kind = "io", size = 0x80 },
]
rom_bar_size = 0x8_0000

# [guest, host]: AMPERE_CHANNEL_GPFIFO_A -> TURING_CHANNEL_GPFIFO_A, AMPERE_COMPUTE_B/_A ->
# TURING_COMPUTE_A, AMPERE_DMA_COPY_B/_A -> TURING_DMA_COPY_A, AMPERE_B/_A -> TURING_A,
# AMPERE_USERMODE_A -> TURING_USERMODE_A (g_allclasses.h of 610.57.04).
class_map = [
    [0xC56F, 0xC46F],
    [0xC7C0, 0xC5C0],
    [0xC6C0, 0xC5C0],
    [0xC7B5, 0xC5B5],
    [0xC6B5, 0xC5B5],
    [0xC797, 0xC597],
    [0xC697, 0xC597],
    [0xC561, 0xC461],
]

[ids]
device = 0x2503
source = "g_nv_name_released.h:641 of 610.57.04 (RTX 3060); no capture"

[display]
label = "board (rtx3060-on-tu106: the RTX 2070 board's DisplayPort SST connector on SOR0)"
connector = [
    { display_id = 0x100, sor = 0, index = 0, kind = "DP" },
]
