#
# The GA100 rung of the limits runs (docs/caraxes/limits-mig-ecc-vgpu.md): an A100 PCIe 40GB
# (GA100, Ampere) over the TU106 of the house. Costume: the chip (chips/ga100), the PCI
# device id 10de:20F1 with subsystem 10de:145F ("NVIDIA A100-PCIE-40GB",
# g_nv_name_released.h:513 of 610.57.04 and of 615.71.09) and the personality. Truth: the
# RTX 2070 board's config layout, ROM, VBIOS and BARs (the Turing boot model runs the
# TU106's FWSEC path, which GA100 shares), and the TU106 that executes. A data-center card
# has no display: no [display].
name = "A100 PCIe"
chip = "ga100"
host_chip = "tu106"
config = "caraxes/reference/rtx2070/config-space.txt"
rom = "caraxes/reference/rtx2070/rom.bin"
vbios_version = "90.06.3D.00.76"

bars = [
    { kind = "mem32", size = 0x100_0000, prefetch = false },
    { kind = "mem64", size = 0x1000_0000, prefetch = true },
    { kind = "mem64", size = 0x200_0000, prefetch = true },
    { kind = "io", size = 0x80 },
]
rom_bar_size = 0x8_0000

# [guest, host]: AMPERE_CHANNEL_GPFIFO_A -> TURING_CHANNEL_GPFIFO_A, AMPERE_COMPUTE_A ->
# TURING_COMPUTE_A, AMPERE_DMA_COPY_A -> TURING_DMA_COPY_A, AMPERE_A -> TURING_A,
# AMPERE_USERMODE_A -> TURING_USERMODE_A (g_allclasses.h of 610.57.04).
class_map = [
    [0xC56F, 0xC46F],
    [0xC6C0, 0xC5C0],
    [0xC6B5, 0xC5B5],
    [0xC697, 0xC597],
    [0xC561, 0xC461],
]

[ids]
device = 0x20F1
sub_vendor = 0x10DE
sub_device = 0x145F
source = "g_nv_name_released.h:513 of 610.57.04 (A100-PCIE-40GB); no capture"
