#
# Costume ladder rung 5 (docs/caraxes/costume-ladder.md): the whole GB206 identity (the
# RTX 5060 Ti of boards/rtx5060ti.toml: config capture, ROM, FSP boot, GMMU v3, Blackwell
# classes) with the TU106 of the house executing (host_chip). Unlike the costume of
# costume-5060.md (5060 Ti ids on the TU106 chip) the chip itself is the lie here.
name = "RTX 5060 Ti"
chip = "gb206"
host_chip = "tu106"
config = "caraxes/reference/gb206/gpu-0000_01_00.0/config-space.txt"
rom = "caraxes/reference/gb206/gpu-0000_01_00.0/rom.bin"
vbios_version = "98.06.1F.40.4A"
msix = false

bars = [
    { kind = "mem32", size = 0x400_0000, prefetch = false },
    { kind = "mem64", size = 0x1000_0000, prefetch = true },
    { kind = "mem64", size = 0x200_0000, prefetch = true },
    { kind = "io", size = 0x80 },
]
rom_bar_size = 0x8_0000

# [guest, host]: BLACKWELL_CHANNEL_GPFIFO_B/_A -> TURING_CHANNEL_GPFIFO_A,
# BLACKWELL_COMPUTE_B/_A -> TURING_COMPUTE_A, BLACKWELL_DMA_COPY_B/_A -> TURING_DMA_COPY_A,
# BLACKWELL_USERMODE_A -> TURING_USERMODE_A (g_allclasses.h of 610.57.04).
class_map = [
    [0xCA6F, 0xC46F],
    [0xC96F, 0xC46F],
    [0xCEC0, 0xC5C0],
    [0xCDC0, 0xC5C0],
    [0xCAB5, 0xC5B5],
    [0xC9B5, 0xC5B5],
    [0xC761, 0xC461],
]
