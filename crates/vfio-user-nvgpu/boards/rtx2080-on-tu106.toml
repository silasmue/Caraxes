#
# Costume ladder rung 1 (docs/caraxes/costume-ladder.md): an RTX 2080 (TU104) over the
# TU106 of the house. Costume: the chip identity (chips/tu104: PMC_BOOT_0/42 of TU104), the
# PCI device id 10de:1e82 ("NVIDIA GeForce RTX 2080", src/nvidia/generated/
# g_nv_name_released.h:47 of 610.57.04) and the personality "RTX 2080" of the guest name.
# Truth: everything else is the RTX 2070 board's (config layout, subsystem 1458:4011, ROM,
# VBIOS, BARs) and every capability answer the TU106's, executed on the TU106 (host_chip).
# No RTX 2080 was read: the device id is the name table's, the rest of the identity is the
# RTX 2070 capture's.
name = "RTX 2080"
chip = "tu104"
host_chip = "tu106"
config = "caraxes/reference/rtx2070/config-space.txt"
rom = "caraxes/reference/rtx2070/rom.bin"
vbios_version = "90.06.3D.00.76"

bars = [
    { kind = "mem32", size = 0x100_0000, prefetch = false },
    { kind = "mem64", size = 0x1000_0000, prefetch = true },
    { kind = "mem64", size = 0x200_0000, prefetch = true },
    { kind = "io", size = 0x80 },
]
rom_bar_size = 0x8_0000

[ids]
device = 0x1E82
source = "g_nv_name_released.h:47 of 610.57.04 (RTX 2080); no capture"

[display]
label = "board (rtx2080-on-tu106: the RTX 2070 board's DisplayPort SST connector on SOR0)"
connector = [
    { display_id = 0x100, sor = 0, index = 0, kind = "DP" },
]
